# AZTMM Earnings Flow Flag — configuration
#
# INTERNAL FILE. Thresholds below never appear on user-visible pages.
# They drive aggregator.py + fetcher.py only.

# Forward window — how many trading days ahead we scan the earnings calendar.
window:
  forward_trading_days: 5     # next 5 trading days (Mon..Fri equivalent)
  include_today: false        # walk-forward: "today" reports have already happened by 5 PM snapshot

# Universe filters (INTERNAL — never rendered)
universe:
  min_marketcap_usd:        500000000    # $500M floor — no microcaps
  min_avg_daily_volume:     1000000      # 1M shares ADV floor — no illiquid names
  exclude_no_options:       true         # exclude names with no options chain
  max_names_scanned:        150          # safety cap on universe size; sorted by marketcap desc so the most-liquid names go first

# Flow-alert qualification (INTERNAL — never rendered)
# A ticker is "flagged" if today's flow-alert stream shows at least one
# alert clearing these floors.
flow:
  min_total_premium_usd:    50000        # $50k premium floor per alert
  min_total_size:           50           # 50-contract floor per alert
  min_alerts_per_ticker:    1            # at least one qualifying alert

# Public surfacing
output:
  top_flagged_public:       25           # max rows shown publicly
  top_flagged_internal:     100
  commentary_top_n:         3

# Call/put tilt bands (premium ratio call/put)
tilt_bands:
  heavily_call_tilted:  2.0
  call_tilted:          1.25
  balanced_lower:       0.80
  put_tilted:           0.50

# UW endpoint paths (private — never rendered to public output)
endpoints:
  earnings_afterhours:  "/api/earnings/afterhours"
  earnings_premarket:   "/api/earnings/premarket"
  flow_alerts:          "/api/option-trades/flow-alerts"

# HTTP behaviour
http:
  base_url: "https://api.unusualwhales.com"
  timeout_seconds: 12
  max_retries: 4
  backoff_seconds: 1.5
  page_limit: 100
  flow_alerts_limit: 50          # per-ticker recent flow-alert page size
  inter_call_sleep: 0.15         # ~0.15s between per-ticker calls — keeps us under the UW per-minute ceiling
