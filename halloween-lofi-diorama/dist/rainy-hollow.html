<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rainy Hollow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" />
    <style>
      /* Single dark world: the letterbox is the night itself. */
      :root {
        --void: #04050b;
        --ink: #a3b8d8;
        --ink-dim: #5670a3;
        --veil: rgba(4, 5, 11, 0.72);
        --ember: #ffb54d;
        --font-pixel: 'Silkscreen', ui-monospace, Menlo, Consolas, monospace;
        --font-mono: ui-monospace, Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--ink);
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      body.idle {
        cursor: none;
      }
      #screen {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: calc(6px + env(safe-area-inset-top, 0px));
        font: 12px/1.4 var(--font-mono);
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        background: var(--veil);
        padding: 2px 6px;
        display: none;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        font: 10px/1.6 var(--font-pixel);
        letter-spacing: 0.06em;
        text-align: center;
        color: var(--ink);
        background: var(--veil);
        padding: 4px 10px;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #hint b {
        color: var(--ember);
        font-weight: normal;
      }
      body.idle #hint,
      body.export #hint {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #hint {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="480" height="270" aria-label="Animated pixel-art Halloween diorama: a cottage on a rainy night with a campfire and jack-o'-lanterns"></canvas>
    <div id="hud"></div>
    <div id="hint"><b>F</b> or double-click: fullscreen &middot; <b>Space</b>: pause &middot; <b>H</b>: stats</div>
    <!-- core -->
    <script>
/* src/engine.js */
/*
 * Halloween Lofi Diorama — core engine
 * ------------------------------------------------------------------
 * Everything is rendered into a 480x270 pixel buffer and scaled up by an
 * integer factor (x4 = 1920x1080, x8 = 3840x2160), so every art pixel stays
 * a perfectly sharp square.
 *
 * The whole picture is a pure function of time t in [0, LOOP). Nothing keeps
 * state between frames, so the animation can be seeked to any instant, loops
 * seamlessly at t = LOOP, and cannot drift no matter how long it runs.
 *
 * Frame pipeline:
 *   1. lights   modules add the light sources for this frame -> lightmap
 *   2. bg       unlit backdrop (sky, moon, clouds, hills, far rain) -> main
 *   3. scene    night-coloured props drawn on their own buffer, then warmed
 *               by the lightmap ("relit") and composited onto main.
 *               Pixels drawn with g.em.* are emissive and skip relighting.
 *   4. fx       particles / atmosphere / post drawn straight onto main
 *               (engine adds: puddle reflections z=20, light halos z=55)
 *   5. present  nearest-neighbour upscale to the on-screen canvas
 */
(function () {
  'use strict';

  const HD = (window.HD = window.HD || {});
  const params = new URLSearchParams(location.search);
  const W = 480;
  const H = 270;
  const NPIX = W * H;

  const num = (k, d) => {
    const v = parseFloat(params.get(k));
    return Number.isFinite(v) ? v : d;
  };
  const flag = (k, d) => {
    if (!params.has(k)) return d;
    const v = params.get(k);
    return !(v === '0' || v === 'false' || v === 'off');
  };

  HD.W = W;
  HD.H = H;
  HD.params = params;
  HD.num = num;
  HD.flag = flag;
  HD.LOOP = Math.min(3600, Math.max(10, num('loop', 240)));
  HD.errors = [];

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);
  HD.clamp = clamp;
  HD.lerp = lerp;
  HD.smoothstep = (a, b, x) => smooth(clamp((x - a) / (b - a), 0, 1));

  // ------------------------------------------------------------------
  // Hashing & seeded randomness (no Math.random anywhere at runtime)
  // ------------------------------------------------------------------
  function mix32(h) {
    h ^= h >>> 16;
    h = Math.imul(h, 0x7feb352d);
    h ^= h >>> 15;
    h = Math.imul(h, 0x846ca68b);
    h ^= h >>> 16;
    return h >>> 0;
  }
  /** Deterministic hash of up to four integers -> [0, 1). */
  function hash(a, b, c, d) {
    let h = mix32((a | 0) + 0x9e3779b9);
    h = mix32(h ^ (((b | 0) + 0x85ebca6b) >>> 0));
    h = mix32(h ^ (((c | 0) + 0xc2b2ae35) >>> 0));
    h = mix32(h ^ (((d | 0) + 0x27d4eb2f) >>> 0));
    return h / 4294967296;
  }
  HD.hash = hash;
  /** Seeded PRNG (mulberry32) for build-time generation in init(). */
  HD.rng = function (seed) {
    let s = (seed | 0) ^ 0x5bd1e995;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      let r = Math.imul(s ^ (s >>> 15), 1 | s);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  };

  // ------------------------------------------------------------------
  // Loop-periodic time helpers.  Every period is snapped so that a whole
  // number of cycles fits into LOOP — that is what makes the loop seamless.
  // ------------------------------------------------------------------
  const TAU = Math.PI * 2;
  /** cycles per loop for a desired period (seconds) */
  function cyclesFor(period) {
    return Math.max(1, Math.round(HD.LOOP / Math.max(1e-6, period)));
  }
  /** phase in [0,1) of a loop-safe oscillator with ~period seconds */
  function phase(t, period, offset) {
    const u = (t * cyclesFor(period)) / HD.LOOP + (offset || 0);
    return u - Math.floor(u);
  }
  /** loop-safe sine in [-1,1] */
  function wave(t, period, offset) {
    return Math.sin(TAU * phase(t, period, offset));
  }
  /** loop-safe smooth value noise in [0,1]; features change every ~period seconds */
  function noise(t, period, seed) {
    const n = cyclesFor(period);
    const u = (t * n) / HD.LOOP;
    const fl = Math.floor(u);
    const f = u - fl;
    const i1 = ((fl % n) + n) % n;
    const i0 = (i1 - 1 + n) % n;
    const i2 = (i1 + 1) % n;
    const i3 = (i1 + 2) % n;
    const s = seed | 0;
    const p0 = hash(s, i0, 91);
    const p1 = hash(s, i1, 91);
    const p2 = hash(s, i2, 91);
    const p3 = hash(s, i3, 91);
    // Catmull-Rom spline through the lattice values (C1-smooth motion)
    const f2 = f * f;
    const f3 = f2 * f;
    const v =
      0.5 *
      (2 * p1 +
        (-p0 + p2) * f +
        (2 * p0 - 5 * p1 + 4 * p2 - p3) * f2 +
        (-p0 + 3 * p1 - 3 * p2 + p3) * f3);
    return clamp(v, 0, 1);
  }
  /** fractal loop-safe noise: octaves halve the period each step */
  function fbm(t, period, seed, octaves) {
    let sum = 0;
    let amp = 1;
    let norm = 0;
    let p = period;
    const o = octaves || 3;
    for (let k = 0; k < o; k++) {
      sum += noise(t, p, (seed | 0) * 7 + k * 131) * amp;
      norm += amp;
      amp *= 0.5;
      p *= 0.5;
    }
    return sum / norm;
  }
  /**
   * Fire/candle flicker in roughly [0,1]: slow breathing + quick dances +
   * rare dips. `speed` > 1 makes it nervier.
   */
  function flicker(t, seed, speed) {
    const sp = speed || 1;
    const slow = noise(t, 1.7 / sp, seed * 13 + 1);
    const mid = noise(t, 0.42 / sp, seed * 13 + 2);
    const fast = noise(t, 0.11 / sp, seed * 13 + 3);
    return clamp(0.45 * slow + 0.35 * mid + 0.2 * fast, 0, 1);
  }
  /** quantise time to a frame-rate for "on-the-twos" sprite animation */
  function step(t, fps) {
    return Math.floor(t * fps + 1e-6) / fps;
  }

  /**
   * Stateless particle cycle. Particle `i` of a system restarts every
   * ~period seconds (snapped so it loops), staggered by a hashed offset.
   * Returns a SHARED object (overwritten by the next call):
   *   age  0..1 progress through the current life
   *   c    cycle index (wrapped, so it repeats after LOOP)
   *   prev previous cycle index (e.g. for splashes where the last drop landed)
   *   P    actual period in seconds
   *   rnd(k [,cycle]) per-cycle random in [0,1)
   */
  const CYC = {
    age: 0,
    c: 0,
    prev: 0,
    n: 1,
    P: 1,
    _s: 0,
    _i: 0,
    rnd(k, cyc) {
      return hash(this._s, this._i, cyc === undefined ? this.c : cyc, k);
    },
  };
  function cycle(t, i, period, seed) {
    const n = cyclesFor(period);
    const P = HD.LOOP / n;
    const off = hash(seed | 0, i | 0, 7777, 3);
    const u = t / P + off;
    const fl = Math.floor(u);
    CYC.age = u - fl;
    CYC.c = ((fl % n) + n) % n;
    CYC.prev = (CYC.c - 1 + n) % n;
    CYC.n = n;
    CYC.P = P;
    CYC._s = seed | 0;
    CYC._i = i | 0;
    return CYC;
  }

  HD.time = { TAU, cyclesFor, phase, wave, noise, fbm, flicker, step, cycle };

  // ------------------------------------------------------------------
  // Ordered dithering
  // ------------------------------------------------------------------
  const BAYER8 = new Float32Array(64);
  (function () {
    const m = [
      [0, 32, 8, 40, 2, 34, 10, 42],
      [48, 16, 56, 24, 50, 18, 58, 26],
      [12, 44, 4, 36, 14, 46, 6, 38],
      [60, 28, 52, 20, 62, 30, 54, 22],
      [3, 35, 11, 43, 1, 33, 9, 41],
      [51, 19, 59, 27, 49, 17, 57, 25],
      [15, 47, 7, 39, 13, 45, 5, 37],
      [63, 31, 55, 23, 61, 29, 53, 21],
    ];
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) BAYER8[y * 8 + x] = (m[y][x] + 0.5) / 64;
  })();
  /** Bayer threshold in (0,1) for pixel (x,y) */
  function bayer(x, y) {
    return BAYER8[((y & 7) << 3) | (x & 7)];
  }
  HD.bayer = bayer;

  // ------------------------------------------------------------------
  // Colour helpers
  // ------------------------------------------------------------------
  const hexCache = new Map();
  function hex(c) {
    let v = hexCache.get(c);
    if (v) return v;
    let s = c.replace('#', '');
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    v = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
    hexCache.set(c, v);
    return v;
  }
  function css(r, g, b) {
    const to = (v) => {
      const s = clamp(Math.round(v), 0, 255).toString(16);
      return s.length < 2 ? '0' + s : s;
    };
    return '#' + to(r) + to(g) + to(b);
  }
  /** mix two hex colours -> hex (use at init time / in ramps, not per pixel) */
  function mixHex(a, b, k) {
    const A = hex(a);
    const B = hex(b);
    return css(lerp(A[0], B[0], k), lerp(A[1], B[1], k), lerp(A[2], B[2], k));
  }
  /** n-step ramp of hex strings between a and b (inclusive) */
  function ramp(a, b, n) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(mixHex(a, b, n === 1 ? 0 : i / (n - 1)));
    return out;
  }
  HD.color = { hex, css, mix: mixHex, ramp };

  // ------------------------------------------------------------------
  // Pixel graphics API. Only integer-aligned fillRect / drawImage are
  // used, so nothing is ever anti-aliased.
  // ------------------------------------------------------------------
  function makeGfx(ctx, maskCtx) {
    let cur = null;
    const set = (c) => {
      if (c !== cur) {
        ctx.fillStyle = c;
        cur = c;
      }
    };
    const R = maskCtx
      ? (x, y, w, h) => {
          ctx.fillRect(x, y, w, h);
          maskCtx.fillRect(x, y, w, h);
        }
      : (x, y, w, h) => ctx.fillRect(x, y, w, h);
    const r = Math.round;

    const g = {
      ctx,
      W,
      H,
      /** forget cached fillStyle (call if you touched ctx.fillStyle directly) */
      reset() {
        cur = null;
        if (maskCtx) maskCtx.fillStyle = '#fff';
      },
      px(x, y, c) {
        set(c);
        R(r(x), r(y), 1, 1);
      },
      rect(x, y, w, h, c) {
        x = r(x);
        y = r(y);
        w = r(w);
        h = r(h);
        if (w <= 0 || h <= 0) return;
        set(c);
        R(x, y, w, h);
      },
      hline(x0, x1, y, c) {
        x0 = r(x0);
        x1 = r(x1);
        if (x1 < x0) {
          const tmp = x0;
          x0 = x1;
          x1 = tmp;
        }
        set(c);
        R(x0, r(y), x1 - x0 + 1, 1);
      },
      vline(x, y0, y1, c) {
        y0 = r(y0);
        y1 = r(y1);
        if (y1 < y0) {
          const tmp = y0;
          y0 = y1;
          y1 = tmp;
        }
        set(c);
        R(r(x), y0, 1, y1 - y0 + 1);
      },
      /** 1px Bresenham line */
      line(x0, y0, x1, y1, c) {
        x0 = r(x0);
        y0 = r(y0);
        x1 = r(x1);
        y1 = r(y1);
        set(c);
        const dx = Math.abs(x1 - x0);
        const dy = -Math.abs(y1 - y0);
        const sx = x0 < x1 ? 1 : -1;
        const sy = y0 < y1 ? 1 : -1;
        let err = dx + dy;
        for (let guard = 0; guard < 4096; guard++) {
          R(x0, y0, 1, 1);
          if (x0 === x1 && y0 === y1) break;
          const e2 = 2 * err;
          if (e2 >= dy) {
            err += dy;
            x0 += sx;
          }
          if (e2 <= dx) {
            err += dx;
            y0 += sy;
          }
        }
      },
      /** filled pixel circle (radius may be fractional) */
      circle(cx, cy, rad, c) {
        cx = r(cx);
        cy = r(cy);
        set(c);
        const rr = rad * rad + rad * 0.6;
        const ry = Math.ceil(rad);
        for (let dy = -ry; dy <= ry; dy++) {
          const s = rr - dy * dy;
          if (s < 0) continue;
          const hw = Math.floor(Math.sqrt(s));
          R(cx - hw, cy + dy, hw * 2 + 1, 1);
        }
      },
      /** 1px pixel-circle outline */
      ring(cx, cy, rad, c) {
        cx = r(cx);
        cy = r(cy);
        set(c);
        const rr = rad * rad + rad * 0.6;
        const ry = Math.ceil(rad);
        let prev = -1;
        for (let dy = -ry; dy <= ry; dy++) {
          const s = rr - dy * dy;
          if (s < 0) continue;
          const hw = Math.floor(Math.sqrt(s));
          const nxt = rr - (Math.abs(dy) + 1) * (Math.abs(dy) + 1);
          const inner = nxt < 0 ? -1 : Math.floor(Math.sqrt(nxt));
          const from = Math.max(inner + 1, 0);
          if (from > hw) {
            R(cx - hw, cy + dy, 1, 1);
            R(cx + hw, cy + dy, 1, 1);
          } else {
            R(cx - hw, cy + dy, hw - from + 1, 1);
            R(cx + from, cy + dy, hw - from + 1, 1);
          }
          prev = hw;
        }
        return prev;
      },
      /** filled ellipse */
      ellipse(cx, cy, rx, ry, c) {
        cx = r(cx);
        cy = r(cy);
        set(c);
        const iy = Math.ceil(ry);
        for (let dy = -iy; dy <= iy; dy++) {
          const k = 1 - (dy * dy) / ((ry + 0.35) * (ry + 0.35));
          if (k < 0) continue;
          const hw = Math.floor((rx + 0.35) * Math.sqrt(k));
          R(cx - hw, cy + dy, hw * 2 + 1, 1);
        }
      },
      /** filled polygon, pts = [[x,y], ...]; sampled at pixel centres */
      poly(pts, c) {
        set(c);
        let minY = Infinity;
        let maxY = -Infinity;
        for (const p of pts) {
          if (p[1] < minY) minY = p[1];
          if (p[1] > maxY) maxY = p[1];
        }
        minY = Math.floor(minY);
        maxY = Math.ceil(maxY);
        const xs = [];
        for (let y = minY; y <= maxY; y++) {
          const sy = y + 0.5;
          xs.length = 0;
          for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            const a = pts[i];
            const b = pts[j];
            if (a[1] <= sy !== b[1] <= sy) xs.push(a[0] + ((sy - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
          }
          xs.sort((p, q) => p - q);
          for (let k = 0; k + 1 < xs.length; k += 2) {
            const xa = Math.ceil(xs[k] - 0.5);
            const xb = Math.floor(xs[k + 1] - 0.5);
            if (xb >= xa) R(xa, y, xb - xa + 1, 1);
          }
        }
      },
      /**
       * Ordered-dither fill: a pixel is drawn where bayer(x,y) < level.
       * level 0 = nothing, 1 = solid. (ox, oy) shifts the pattern.
       */
      dither(x, y, w, h, c, level, ox, oy) {
        if (level <= 0) return;
        if (level >= 1) return g.rect(x, y, w, h, c);
        x = r(x);
        y = r(y);
        w = r(w);
        h = r(h);
        const sx = ox | 0;
        const sy = oy | 0;
        set(c);
        for (let yy = y; yy < y + h; yy++)
          for (let xx = x; xx < x + w; xx++) if (bayer(xx + sx, yy + sy) < level) R(xx, yy, 1, 1);
      },
      /** dithered disc whose density fades towards the rim by `soft` (0..1) */
      ditherCircle(cx, cy, rad, c, level, soft, ox, oy) {
        if (level <= 0 || rad <= 0) return;
        cx = r(cx);
        cy = r(cy);
        const sx = ox | 0;
        const sy = oy | 0;
        const sf = soft || 0;
        set(c);
        const ir = Math.ceil(rad);
        const rr = rad * rad + rad * 0.6;
        for (let dy = -ir; dy <= ir; dy++) {
          for (let dx = -ir; dx <= ir; dx++) {
            const d2 = dx * dx + dy * dy;
            if (d2 > rr) continue;
            let lv = level;
            if (sf > 0) lv *= 1 - sf * Math.sqrt(d2 / rr);
            const px = cx + dx;
            const py = cy + dy;
            if (bayer(px + sx, py + sy) < lv) R(px, py, 1, 1);
          }
        }
      },
      /** blit a pre-rendered canvas/sprite at integer coordinates */
      sprite(img, x, y, flipX) {
        x = r(x);
        y = r(y);
        if (flipX) {
          ctx.save();
          ctx.translate(x + img.width, y);
          ctx.scale(-1, 1);
          ctx.drawImage(img, 0, 0);
          ctx.restore();
          if (maskCtx) {
            maskCtx.save();
            maskCtx.translate(x + img.width, y);
            maskCtx.scale(-1, 1);
            maskCtx.drawImage(img, 0, 0);
            maskCtx.restore();
          }
        } else {
          ctx.drawImage(img, x, y);
          if (maskCtx) maskCtx.drawImage(img, x, y);
        }
      },
      /** blit a sub-rectangle of a sprite (e.g. a frame of a sheet) */
      blit(img, sx, sy, sw, sh, x, y) {
        x = r(x);
        y = r(y);
        ctx.drawImage(img, sx, sy, sw, sh, x, y, sw, sh);
        if (maskCtx) maskCtx.drawImage(img, sx, sy, sw, sh, x, y, sw, sh);
      },
    };
    return g;
  }
  HD.makeGfx = makeGfx;

  function newCanvas(w, h, readback) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d', readback ? { willReadFrequently: true } : undefined);
    ctx.imageSmoothingEnabled = false;
    return c;
  }
  HD.canvas = newCanvas;

  /** Render something once into an offscreen canvas: HD.bake(w, h, g => {...}) */
  HD.bake = function (w, h, fn) {
    const c = newCanvas(w, h, true);
    const g = makeGfx(c.getContext('2d'));
    fn(g, c);
    return c;
  };

  /**
   * Build a sprite from ASCII rows. `map` maps characters to hex colours;
   * '.' and ' ' are transparent.  HD.sprite(['.ab.', 'abba'], {a:'#123', b:'#456'})
   */
  HD.sprite = function (rows, map) {
    const h = rows.length;
    let w = 0;
    for (const row of rows) w = Math.max(w, row.length);
    return HD.bake(w, h, (g) => {
      for (let y = 0; y < h; y++) {
        const row = rows[y];
        for (let x = 0; x < row.length; x++) {
          const ch = row[x];
          if (ch === '.' || ch === ' ') continue;
          const c = map[ch];
          if (c) g.px(x, y, c);
        }
      }
    });
  };

  // ------------------------------------------------------------------
  // Buffers
  // ------------------------------------------------------------------
  const main = newCanvas(W, H, true);
  const mainCtx = main.getContext('2d');
  const scene = newCanvas(W, H, true);
  const sceneCtx = scene.getContext('2d');
  const emc = newCanvas(W, H, true);
  const emCtx = emc.getContext('2d');
  emCtx.fillStyle = '#fff';

  const gMain = makeGfx(mainCtx);
  const gScene = makeGfx(sceneCtx);
  gScene.em = makeGfx(sceneCtx, emCtx);
  HD.buffers = { main, scene, emissive: emc };

  // ------------------------------------------------------------------
  // Lights & relighting
  // ------------------------------------------------------------------
  // Night colours are painted as they look under cold ambient light. A light
  // adds   night * (1/AMBIENT) * lightColour * intensity * falloff
  // i.e. it reveals the "true" warm albedo hidden in the night colour.
  const AMB = [0.34, 0.38, 0.52];
  const INV_AMB = AMB.map((v) => 1 / v);
  HD.AMBIENT = AMB;

  const LR = new Float32Array(NPIX);
  const LG = new Float32Array(NPIX);
  const LB = new Float32Array(NPIX);
  const lights = [];
  const mapCache = new Map();

  /**
   * Banded falloff map (pixel-art light pools). Bands are flat with a narrow
   * ordered-dither seam between them; dither is in light-local coordinates so
   * moving lights carry their pattern with them.
   */
  function falloffMap(rx, ry, bands, ditherW, pow) {
    const key = rx + '|' + ry + '|' + bands + '|' + ditherW + '|' + pow;
    let m = mapCache.get(key);
    if (m) return m;
    const w = rx * 2 + 1;
    const h = ry * 2 + 1;
    const data = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const dx = (x - rx) / (rx + 0.5);
        const dy = (y - ry) / (ry + 0.5);
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d >= 1) continue;
        let f = Math.pow(1 - d, pow);
        if (bands > 0) {
          const q = f * bands;
          const b = Math.floor(q);
          const fr = q - b;
          const th = 0.5 + (bayer(x, y) - 0.5) * ditherW;
          f = (b + (fr > th ? 1 : 0)) / bands;
        }
        data[y * w + x] = f;
      }
    }
    m = { w, h, rx, ry, data };
    mapCache.set(key, m);
    return m;
  }

  const LightAPI = {
    /**
     * Add a light for this frame.
     *  x, y      centre (integers recommended)
     *  r         radius in px (ry for an elliptical pool, defaults to r)
     *  color     [r,g,b] multipliers, e.g. HD.LIGHT.fire
     *  i         intensity (0..~2), usually driven by HD.time.flicker
     *  bands     number of flat bands (default 5), dither 0..1 seam width
     *  pow       falloff exponent (default 1.6)
     *  clip      {x0,y0,x1,y1} restrict to a rectangle (e.g. only the ground)
     *  halo      {r, a, color?} additive glow sprite drawn in fx at z=55
     */
    add(o) {
      if (!o || !(o.i > 0)) return;
      lights.push(o);
    },
    list: lights,
  };
  HD.lights = LightAPI;

  function buildLightmap() {
    LR.fill(0);
    LG.fill(0);
    LB.fill(0);
    for (const l of lights) {
      const rx = Math.max(1, Math.round(l.r));
      const ry = Math.max(1, Math.round(l.ry || l.r));
      const m = falloffMap(rx, ry, l.bands === undefined ? 5 : l.bands, l.dither === undefined ? 0.55 : l.dither, l.pow || 1.6);
      const cx = Math.round(l.x);
      const cy = Math.round(l.y);
      const col = l.color || [1, 0.6, 0.3];
      const kr = col[0] * l.i;
      const kg = col[1] * l.i;
      const kb = col[2] * l.i;
      let x0 = cx - rx;
      let y0 = cy - ry;
      let x1 = cx + rx;
      let y1 = cy + ry;
      const cl = l.clip;
      if (cl) {
        x0 = Math.max(x0, cl.x0);
        y0 = Math.max(y0, cl.y0);
        x1 = Math.min(x1, cl.x1);
        y1 = Math.min(y1, cl.y1);
      }
      x0 = Math.max(0, x0);
      y0 = Math.max(0, y0);
      x1 = Math.min(W - 1, x1);
      y1 = Math.min(H - 1, y1);
      for (let y = y0; y <= y1; y++) {
        const my = (y - cy + ry) * m.w;
        const row = y * W;
        for (let x = x0; x <= x1; x++) {
          const f = m.data[my + (x - cx + rx)];
          if (f === 0) continue;
          const p = row + x;
          LR[p] += kr * f;
          LG[p] += kg * f;
          LB[p] += kb * f;
        }
      }
    }
  }

  /** Sample the current lightmap (fx can tint rain/smoke by it). */
  const LS = [0, 0, 0];
  LightAPI.rgb = function (x, y) {
    x = Math.round(x);
    y = Math.round(y);
    if (x < 0 || y < 0 || x >= W || y >= H) {
      LS[0] = LS[1] = LS[2] = 0;
      return LS;
    }
    const p = y * W + x;
    LS[0] = LR[p];
    LS[1] = LG[p];
    LS[2] = LB[p];
    return LS;
  };
  LightAPI.lum = function (x, y) {
    x = Math.round(x);
    y = Math.round(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return 0;
    const p = y * W + x;
    return 0.4 * LR[p] + 0.45 * LG[p] + 0.15 * LB[p];
  };

  const view = params.get('view') || '';

  function relight() {
    const img = sceneCtx.getImageData(0, 0, W, H);
    const d = img.data;
    const em = emCtx.getImageData(0, 0, W, H).data;
    if (view === 'albedo') {
      sceneCtx.putImageData(img, 0, 0);
      return;
    }
    for (let p = 0, q = 0; p < NPIX; p++, q += 4) {
      if (d[q + 3] === 0 || em[q + 3] !== 0) continue;
      const lr = LR[p];
      const lg = LG[p];
      const lb = LB[p];
      if (lr + lg + lb < 0.004) continue;
      const r = d[q];
      const g = d[q + 1];
      const b = d[q + 2];
      d[q] = r + r * INV_AMB[0] * lr;
      d[q + 1] = g + g * INV_AMB[1] * lg;
      d[q + 2] = b + b * INV_AMB[2] * lb;
    }
    sceneCtx.putImageData(img, 0, 0);
  }

  // glow sprites (additive halos) — banded, dithered, cached per radius/colour
  const glowCache = new Map();
  function glowSprite(rad, col) {
    const key = rad + '|' + col.join(',');
    let s = glowCache.get(key);
    if (s) return s;
    const rr = Math.max(2, Math.round(rad));
    const m = falloffMap(rr, rr, 6, 0.8, 2.2);
    s = HD.bake(m.w, m.h, (g, c) => {
      const cx = c.getContext('2d');
      const im = cx.createImageData(m.w, m.h);
      for (let i = 0; i < m.data.length; i++) {
        const f = m.data[i];
        im.data[i * 4] = clamp(255 * col[0] * f, 0, 255);
        im.data[i * 4 + 1] = clamp(255 * col[1] * f, 0, 255);
        im.data[i * 4 + 2] = clamp(255 * col[2] * f, 0, 255);
        im.data[i * 4 + 3] = 255;
      }
      cx.putImageData(im, 0, 0);
    });
    glowCache.set(key, s);
    return s;
  }
  /** Additive banded glow around (x,y) on the fx layer. alpha 0..1 */
  HD.glow = function (g, x, y, rad, color, alpha) {
    if (!(alpha > 0)) return;
    const s = glowSprite(rad, color);
    const ctx = g.ctx;
    const pa = ctx.globalAlpha;
    const pc = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.drawImage(s, Math.round(x) - (s.width >> 1), Math.round(y) - (s.height >> 1));
    ctx.globalAlpha = pa;
    ctx.globalCompositeOperation = pc;
  };

  // ------------------------------------------------------------------
  // Puddle reflections (engine fx pass, z = 20)
  // layout.puddles: [{x, y, rx, ry, mirror, k}] — ellipse in screen space,
  // `mirror` = y of the line being reflected about (base of reflected
  // objects), k = reflectivity 0..1.
  // ------------------------------------------------------------------
  function reflections(g, t) {
    const pud = HD.layout && HD.layout.puddles;
    if (!pud || !pud.length) return;
    for (let pi = 0; pi < pud.length; pi++) {
      const P = pud[pi];
      const cx = Math.round(P.x);
      const cy = Math.round(P.y);
      const rx = Math.round(P.rx);
      const ry = Math.round(P.ry);
      const m = Math.round(P.mirror);
      const k = P.k === undefined ? 0.6 : P.k;
      const yTop = cy - ry;
      const yBot = cy + ry;
      const srcTop = Math.max(0, 2 * m - yBot - 1);
      const x0 = Math.max(0, cx - rx - 2);
      const x1 = Math.min(W - 1, cx + rx + 2);
      const bw = x1 - x0 + 1;
      const bh = yBot - srcTop + 1;
      if (bh <= 0 || bw <= 0) continue;
      const img = mainCtx.getImageData(x0, srcTop, bw, bh);
      const d = img.data;
      const src = new Uint8ClampedArray(d);
      for (let y = yTop; y <= yBot; y++) {
        const dy = (y - cy) / (ry + 0.5);
        const kk = 1 - dy * dy;
        if (kk <= 0) continue;
        const hw = Math.floor((rx + 0.4) * Math.sqrt(kk));
        // gentle horizontal ripple wobble per row (loop-safe)
        const wob = Math.round(0.9 * Math.sin(TAU * (phase(t, 1.9, pi * 0.37) + y * 0.29)));
        const sy = 2 * m - y - 1;
        for (let x = cx - hw; x <= cx + hw; x++) {
          const sx = clamp(x + wob, x0, x1);
          const di = ((y - srcTop) * bw + (x - x0)) * 4;
          const si = ((sy - srcTop) * bw + (sx - x0)) * 4;
          if (sy < srcTop) continue;
          // reflected colour is darker and slightly cooler
          const fr = src[si] * 0.82;
          const fg = src[si + 1] * 0.86;
          const fb = src[si + 2] * 0.95;
          d[di] = d[di] * (1 - k) + fr * k;
          d[di + 1] = d[di + 1] * (1 - k) + fg * k;
          d[di + 2] = d[di + 2] * (1 - k) + fb * k;
        }
      }
      mainCtx.putImageData(img, x0, srcTop);
    }
  }

  function halos(g) {
    for (const l of lights) {
      if (!l.halo) continue;
      const h = l.halo;
      HD.glow(g, h.x === undefined ? l.x : h.x, h.y === undefined ? l.y : h.y, h.r, h.color || l.color, (h.a || 0.2) * Math.min(1.5, l.i));
    }
  }

  // ------------------------------------------------------------------
  // Module registry
  // ------------------------------------------------------------------
  const passes = { bg: [], scene: [], fx: [] };
  const lightFns = [];
  const inits = [];
  const only = params.get('only') ? new Set(params.get('only').split(',')) : null;
  const skip = params.get('skip') ? new Set(params.get('skip').split(',')) : null;
  HD.moduleNames = [];

  /**
   * HD.module(name, {
   *   init(),                       // once, before the first frame (bake sprites here)
   *   lights(t, L),                 // add lights: L.add({...})
   *   passes: [{layer:'bg'|'scene'|'fx', z:Number, draw(g, t)}],
   * })
   * Skip/isolate modules with ?skip=a,b or ?only=a,b
   */
  HD.module = function (name, def) {
    if (only && !only.has(name)) return;
    if (skip && skip.has(name)) return;
    HD.moduleNames.push(name);
    if (def.init) inits.push({ name, fn: def.init });
    if (def.lights) lightFns.push({ name, fn: def.lights });
    for (const p of def.passes || []) {
      const list = passes[p.layer];
      if (!list) throw new Error('HD.module ' + name + ': unknown layer ' + p.layer);
      list.push({ name: name + ':' + (p.id || p.layer + p.z), z: p.z || 0, draw: p.draw });
    }
  };

  HD.module('engine-reflections', { passes: [{ layer: 'fx', z: 20, id: 'reflections', draw: reflections }] });
  HD.module('engine-halos', { passes: [{ layer: 'fx', z: 55, id: 'halos', draw: halos }] });

  const errSeen = new Set();
  function report(name, e) {
    if (errSeen.has(name)) return;
    errSeen.add(name);
    HD.errors.push(name + ': ' + (e && e.stack ? e.stack : e));
    console.error('[HD] ' + name, e);
  }
  function resetCtx(ctx, g) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    g.reset();
    if (g.em) g.em.reset();
  }
  // ?prof=1 records per-pass timings in HD.prof (used by tools/perf.mjs)
  const prof = flag('prof', false) ? (HD.prof = {}) : null;
  function run(list, g, t) {
    for (const p of list) {
      const a = prof ? performance.now() : 0;
      try {
        p.draw(g, t);
      } catch (e) {
        report(p.name, e);
      }
      resetCtx(g.ctx, g);
      if (prof) {
        const e = prof[p.name] || (prof[p.name] = { ms: 0, n: 0 });
        e.ms += performance.now() - a;
        e.n++;
      }
    }
  }

  // ------------------------------------------------------------------
  // Frame
  // ------------------------------------------------------------------
  function wrapT(t) {
    const L = HD.LOOP;
    return ((t % L) + L) % L;
  }
  HD.wrap = wrapT;

  function render(t) {
    HD.t = t;
    lights.length = 0;
    for (const lf of lightFns) {
      try {
        lf.fn(t, LightAPI);
      } catch (e) {
        report(lf.name + ':lights', e);
      }
    }
    let pa = prof ? performance.now() : 0;
    buildLightmap();
    if (prof) {
      const e = prof['engine:lights+lightmap'] || (prof['engine:lights+lightmap'] = { ms: 0, n: 0 });
      e.ms += performance.now() - pa;
      e.n++;
    }

    resetCtx(mainCtx, gMain);
    mainCtx.fillStyle = '#000';
    mainCtx.fillRect(0, 0, W, H);
    gMain.reset();
    if (view !== 'scene' && view !== 'albedo') run(passes.bg, gMain, t);

    sceneCtx.clearRect(0, 0, W, H);
    emCtx.clearRect(0, 0, W, H);
    resetCtx(sceneCtx, gScene);
    run(passes.scene, gScene, t);
    pa = prof ? performance.now() : 0;
    relight();
    mainCtx.drawImage(scene, 0, 0);
    if (prof) {
      const e = prof['engine:relight'] || (prof['engine:relight'] = { ms: 0, n: 0 });
      e.ms += performance.now() - pa;
      e.n++;
    }

    if (view !== 'scene' && view !== 'albedo') run(passes.fx, gMain, t);

    if (view === 'light') {
      const img = mainCtx.getImageData(0, 0, W, H);
      for (let p = 0; p < NPIX; p++) {
        img.data[p * 4] = clamp(LR[p] * 160, 0, 255);
        img.data[p * 4 + 1] = clamp(LG[p] * 160, 0, 255);
        img.data[p * 4 + 2] = clamp(LB[p] * 160, 0, 255);
        img.data[p * 4 + 3] = 255;
      }
      mainCtx.putImageData(img, 0, 0);
    } else if (view === 'em') {
      mainCtx.fillStyle = '#000';
      mainCtx.fillRect(0, 0, W, H);
      mainCtx.drawImage(emc, 0, 0);
    }
  }

  // ------------------------------------------------------------------
  // Display: integer nearest-neighbour upscale, centred, letterboxed
  // ------------------------------------------------------------------
  let disp = null;
  let dctx = null;
  const fitMode = params.get('fit') || 'int';
  function resize() {
    if (!disp) return;
    const dpr = window.devicePixelRatio || 1;
    const vw = Math.round(window.innerWidth * dpr);
    const vh = Math.round(window.innerHeight * dpr);
    let k = Math.min(vw / W, vh / H);
    if (fitMode !== 'stretch') k = Math.max(1, Math.floor(k + 1e-6));
    const cw = Math.max(W, Math.round(W * k));
    const ch = Math.max(H, Math.round(H * k));
    disp.width = cw;
    disp.height = ch;
    disp.style.width = cw / dpr + 'px';
    disp.style.height = ch / dpr + 'px';
    dctx.imageSmoothingEnabled = false;
  }
  function present() {
    if (!dctx) return;
    dctx.imageSmoothingEnabled = false;
    dctx.drawImage(main, 0, 0, disp.width, disp.height);
  }

  // ------------------------------------------------------------------
  // Hooks for tools (screenshots, verification, video export)
  // ------------------------------------------------------------------
  HD.renderAt = function (t, opts) {
    render(opts && opts.nowrap ? t : wrapT(t));
    present();
    return HD.errors.length;
  };
  /** base64 RGBA of the 480x270 frame */
  HD.pixels = function () {
    const d = mainCtx.getImageData(0, 0, W, H).data;
    let s = '';
    const CH = 0x8000;
    for (let i = 0; i < d.length; i += CH) s += String.fromCharCode.apply(null, d.subarray(i, i + CH));
    return btoa(s);
  };
  /** PNG data URL of the frame scaled by integer k, optional crop {x,y,w,h} */
  HD.png = function (k, crop) {
    const c = crop || { x: 0, y: 0, w: W, h: H };
    const out = newCanvas(c.w * k, c.h * k);
    const o = out.getContext('2d');
    o.imageSmoothingEnabled = false;
    o.drawImage(main, c.x, c.y, c.w, c.h, 0, 0, c.w * k, c.h * k);
    return out.toDataURL('image/png');
  };

  // ------------------------------------------------------------------
  // Boot & live loop
  // ------------------------------------------------------------------
  const exportMode = flag('export', false);
  const speed = num('speed', 1);
  const startT = num('t', 0);
  let paused = flag('pause', false);
  let t0 = 0;
  let pausedT = startT;
  let hud = flag('hud', false);
  let hudEl = null;
  let fpsAcc = 0;
  let fpsN = 0;
  let fpsShow = 0;
  let msShow = 0;
  let lastNow = 0;
  let curT = startT;

  function liveT(now) {
    return wrapT(startT + ((now - t0) / 1000) * speed);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const t = paused ? pausedT : liveT(now);
    curT = t;
    const a = performance.now();
    render(t);
    present();
    const ms = performance.now() - a;
    if (hud && hudEl) {
      fpsAcc += now - lastNow;
      fpsN++;
      msShow = msShow * 0.95 + ms * 0.05;
      if (fpsAcc > 500) {
        fpsShow = (fpsN * 1000) / fpsAcc;
        fpsAcc = 0;
        fpsN = 0;
      }
      hudEl.textContent =
        't ' + t.toFixed(2) + ' / ' + HD.LOOP + 's   ' + fpsShow.toFixed(0) + ' fps   render ' + msShow.toFixed(2) + ' ms' + (HD.errors.length ? '   ERR ' + HD.errors.length : '');
    }
    lastNow = now;
  }

  function boot() {
    disp = document.getElementById('screen');
    if (disp) {
      dctx = disp.getContext('2d', { alpha: false });
      resize();
      window.addEventListener('resize', resize);
    }
    for (const k of ['bg', 'scene', 'fx']) passes[k].sort((a, b) => a.z - b.z);
    for (const it of inits) {
      try {
        it.fn();
      } catch (e) {
        report(it.name + ':init', e);
      }
    }
    HD.isReady = true;
    if (exportMode || !disp) {
      document.body.classList.add('export');
      return;
    }

    // Respect reduced-motion: start paused and say how to play.
    const hint = document.getElementById('hint');
    if (!params.has('pause') && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      paused = true;
      if (hint) hint.textContent = 'Paused because reduced motion is on. Press Space to play.';
    }

    // Keep the screen awake for long sessions (may be refused; that's fine).
    let wakeLock = null;
    const askWake = () => {
      if (document.visibilityState !== 'visible' || !navigator.wakeLock) return;
      navigator.wakeLock
        .request('screen')
        .then((l) => (wakeLock = l))
        .catch(() => {});
    };
    askWake();
    document.addEventListener('visibilitychange', () => {
      if (!wakeLock || wakeLock.released) askWake();
    });

    hudEl = document.getElementById('hud');
    if (hudEl) hudEl.style.display = hud ? 'block' : 'none';
    t0 = performance.now();
    lastNow = t0;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      else if (e.key === ' ') {
        if (paused) {
          t0 = performance.now() - ((pausedT - startT) / speed) * 1000;
          paused = false;
        } else {
          pausedT = curT;
          paused = true;
        }
        e.preventDefault();
      } else if (e.key === 'h' || e.key === 'H') {
        hud = !hud;
        if (hudEl) hudEl.style.display = hud ? 'block' : 'none';
      }
    });
    disp.addEventListener('dblclick', toggleFullscreen);
    let idle = null;
    const wake = () => {
      document.body.classList.remove('idle');
      clearTimeout(idle);
      idle = setTimeout(() => document.body.classList.add('idle'), 2000);
    };
    window.addEventListener('mousemove', wake);
    wake();
    requestAnimationFrame(frame);
  }

  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) document.exitFullscreen();
  }

  // Module scripts follow engine.js synchronously, so they have all registered
  // by DOMContentLoaded (no need to wait for fonts or other subresources).
  if (document.readyState !== 'loading') setTimeout(boot, 0);
  else document.addEventListener('DOMContentLoaded', boot);
})();

    <script>
/* src/palette.js */
/*
 * Palette — cold rainy night vs. warm pockets of firelight.
 * Ramps run dark -> light. Paint the scene in the COLD ramps (that is how
 * things look under rainy-night ambient light); the engine's relighting warms
 * whatever sits near a light. Use the WARM ramps only for things that emit
 * light themselves (flames, embers, lit windows, carved pumpkin faces).
 */
(function () {
  'use strict';
  const HD = (window.HD = window.HD || {});

  HD.PAL = {
    // --- cold -----------------------------------------------------------
    // deep night blues: sky, rain, far silhouettes
    night: ['#04050b', '#080a16', '#0d1122', '#121831', '#18203f', '#1f2a4f', '#283661', '#334474', '#41558a', '#5670a3', '#7790bd', '#a3b8d8', '#d2def0'],
    // violet shadows (Halloween mood in the darks)
    violet: ['#0e0a18', '#160f24', '#1f1532', '#2a1c42', '#372555', '#47306a', '#5c3f82'],
    // cool slate greys: stone, tombstones, roof slate, iron
    stone: ['#101219', '#171a24', '#20242f', '#2b303d', '#383e4e', '#4a5163', '#626a7e', '#8089a0'],
    // night grass & foliage (teal-leaning)
    moss: ['#0a1214', '#0f1b1d', '#152527', '#1c3132', '#253f3e', '#30504c', '#3f6460'],
    // wood at night (purple-brown)
    wood: ['#0f0b10', '#171117', '#20171f', '#2a1e27', '#362731', '#43313b', '#553f48', '#6a5059'],
    // earth cross-section & mud

    <script>
/* src/bg.js */
/*
 * bg — the unlit backdrop of Rainy Hollow.
 *   z0   sky: flat overcast bands with ordered-dither seams, banded moon halo and
 *        the moon disc with subtle crater clusters (all baked once)
 *   z3   far clouds: violet stratus banks along the horizon      (1 tile / loop)
 *   z5   mid clouds: scattered dark clumps that veil the moon     (1 tile / loop)
 *   z7   near clouds: heavy overcast with lumpy hanging bottoms   (2 tiles / loop)
 *        every cloud layer is a tileable canvas blitted with wrap-around, plus
 *        three pre-baked "moonlit" variants revealed through dithered radial
 *        masks around the moon (silver-lined edges, glowing veils)
 *   z8   lightning: once per loop, 3 soft pulses inside a horizon bank (~0.5 s)
 *   z10  distant landscape: hazy far hills with a chapel, darker hills, pine line
 *   z11  the chapel's tiny warm window + two far cottage lights (slow flicker)
 *   z18  bats: a pair flaps past the moon every ~80 s
 * Per frame: a handful of drawImage calls and a few pixels.
 */
(function () {
  'use strict';
  const HD = window.HD;
  const P = HD.PAL;
  const T = HD.time;
  const LAY = HD.layout;
  const MOON = LAY.moon;
  const W = HD.W;
  const mix = HD.color.mix;
  const hex = HD.color.hex;

  // ------------------------------------------------------------------
  // init-time raster helpers
  // ------------------------------------------------------------------
  /** RGBA raster -> canvas */
  function Img(w, h) {
    this.w = w;
    this.h = h;
    this.d = new Uint8ClampedArray(w * h * 4);
  }
  Img.prototype.set = function (x, y, c) {
    x = Math.round(x);
    y = Math.round(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const v = hex(c);
    const i = (y * this.w + x) * 4;
    this.d[i] = v[0];
    this.d[i + 1] = v[1];
    this.d[i + 2] = v[2];
    this.d[i + 3] = 255;
  };
  Img.prototype.on = function (x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return false;
    return this.d[(y * this.w + x) * 4 + 3] > 0;
  };
  Img.prototype.canvas = function () {
    const self = this;
    return HD.bake(this.w, this.h, (g, cv) => {
      const ctx = cv.getContext('2d');
      const id = ctx.createImageData(self.w, self.h);
      id.data.set(self.d);
      ctx.putImageData(id, 0, 0);
    });
  };

  /** tone map (0 = empty, 1 shadow, 2 base, 3 light, 4 rim) with x wrap */
  function Tones(w, h) {
    this.w = w;
    this.h = h;
    this.a = new Uint8Array(w * h);
  }
  Tones.prototype.get = function (x, y) {
    if (y < 0 || y >= this.h) return 0;
    return this.a[y * this.w + (((x % this.w) + this.w) % this.w)];
  };
  Tones.prototype.put = function (x, y, v) {
    if (y < 0 || y >= this.h) return;
    this.a[y * this.w + (((x % this.w) + this.w) % this.w)] = v;
  };
  /**
   * Paint one cloud object: the union of several puffs (ellipses), shaded as
   * ONE silhouette so it reads as a clean cluster: a 1px rim + lit band on the
   * upper right (moon side), a dark band along the underside, and the
   * upper-right contour of a few "front" puffs as inner lumps.
   * puffs: [cx, cy, rx, ry, base?, front?]  (base clips to a flat bottom row)
   */
  function cloud(tn, puffs, rim, darkUnder) {
    let x0 = Infinity;
    let x1 = -Infinity;
    let y0 = Infinity;
    let y1 = -Infinity;
    for (const p of puffs) {
      x0 = Math.min(x0, Math.floor(p[0] - p[2] - 2));
      x1 = Math.max(x1, Math.ceil(p[0] + p[2] + 2));
      y0 = Math.min(y0, Math.floor(p[1] - p[3] - 2));
      y1 = Math.max(y1, Math.ceil(p[1] + p[3] + 2));
    }
    const bw = x1 - x0 + 1;
    const bh = y1 - y0 + 1;
    const inP = (p, x, y) => {
      if (p[4] !== undefined && y > p[4]) return false;
      const dx = (x - p[0]) / p[2];
      const dy = (y - p[1]) / p[3];
      return dx * dx + dy * dy <= 1;
    };
    const m = new Uint8Array(bw * bh);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) for (const p of puffs) if (inP(p, x, y)) m[(y - y0) * bw + (x - x0)] = 1;
    const M = (x, y) => (x < x0 || x > x1 || y < y0 || y > y1 ? 0 : m[(y - y0) * bw + (x - x0)]);
    const under = darkUnder || 3;
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) {
        if (!M(x, y)) continue;
        let v = 2;
        if (!M(x, y + under) || !M(x - 1, y + under - 1)) v = 1;
        if (!M(x + 1, y - 2) || !M(x + 2, y - 1)) v = 3;
        if (rim && (!M(x, y - 1) || !M(x + 1, y - 1))) v = 4;
        tn.put(x, y, v);
      }
    // inner lumps: upper-right contour of "front" puffs inside the silhouette
    for (const p of puffs) {
      if (!p[5]) continue;
      for (let y = Math.floor(p[1] - p[3]); y <= p[1] - p[3] * 0.25; y++)
        for (let x = Math.floor(p[0] + p[2] * 0.1); x <= Math.ceil(p[0] + p[2] * 0.85); x++) {
          if (!inP(p, x, y) || inP(p, x + 1, y - 1)) continue;
          if (!M(x + 1, y - 1)) continue; // already the outer edge
          tn.put(x, y, 3);
        }
    }
  }
  /** remove lone pixels so every tone reads as a cluster */
  function tidy(tn, passes) {
    const w = tn.w;
    const h = tn.h;
    for (let p = 0; p < passes; p++) {
      const out = tn.a.slice();
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          const v = tn.get(x, y);
          const n = [tn.get(x - 1, y), tn.get(x + 1, y), tn.get(x, y - 1), tn.get(x, y + 1)];
          let same = 0;
          let filled = 0;
          for (const q of n) {
            if (q === v) same++;
            if (q) filled++;
          }
          if (same > 0) continue;
          if (v && filled === 0) {
            out[y * w + x] = 0;
            continue;
          }
          // adopt the most common neighbour tone
          const cnt = [0, 0, 0, 0, 0];
          for (const q of n) cnt[q]++;
          let best = 0;
          for (let k = 1; k < 5; k++) if (cnt[k] > cnt[best] || (best === 0 && cnt[k] > 0 && cnt[k] >= cnt[0])) best = k;
          if (!v && filled < 3) continue; // small notches in the silhouette are fine
          out[y * w + x] = best;
        }
      tn.a = out;
    }
  }
  function tonesToCanvas(tn, pal) {
    const im = new Img(tn.w, tn.h);
    for (let y = 0; y < tn.h; y++)
      for (let x = 0; x < tn.w; x++) {
        const v = tn.a[y * tn.w + x];
        if (v) im.set(x, y, pal[v - 1]);
      }
    return im.canvas();
  }
  const shade = (pal, target, ks) => pal.map((c, i) => mix(c, target, ks[i]));

  // ------------------------------------------------------------------
  // Sky (bands, dithered seams), moon halo, moon
  // ------------------------------------------------------------------
  const SKY_BANDS = [
    P.night[1], //               y < 24
    mix(P.night[1], P.night[2], 0.5), // < 48
    P.night[2], //               < 72
    mix(P.night[3], P.violet[1], 0.5), // < 96
    mix(P.night[4], P.violet[2], 0.5), // < 118
    mix(P.night[4], P.violet[3], 0.6), // < 140
    mix(P.night[5], P.violet[4], 0.5), // < 162
    mix(P.night[6], P.violet[4], 0.55),
  ];
  const SKY_EDGES = [24, 48, 72, 96, 118, 140, 162];
  const SEAM = 5;
  function skyBand(x, y) {
    const b = HD.bayer(x, y);
    let n = 0;
    for (let j = 0; j < SKY_EDGES.length; j++) if ((y - SKY_EDGES[j] + SEAM + 0.5) / (2 * SEAM + 1) > b) n++;
    return n;
  }

  function bakeSky() {
    const im = new Img(W, 210);
    for (let y = 0; y < 210; y++)
      for (let x = 0; x < W; x++) {
        let c = SKY_BANDS[skyBand(x, y)];
        // banded halo around the moon (dithered band edges)
        const dx = x - MOON.x;
        const dy = y - MOON.y;
        const d = Math.sqrt(dx * dx + dy * dy) + (HD.bayer(x + 3, y + 5) - 0.5) * 5;
        if (d < 64) {
          const k = d < 23 ? 0.24 : d < 31 ? 0.15 : d < 44 ? 0.085 : 0.04;
          c = mix(c, P.moon[0], k);
        }
        im.set(x, y, c);
      }
    // the moon disc
    const r = MOON.r;
    const rr = r * r + r * 0.6;
    const inD = (dx, dy) => dx * dx + dy * dy <= rr;
    const craters = [
      // [dx, dy, rx, ry] crater clusters / maria (moon-local)
      [-5, -4, 3.6, 2.6],
      [-8, -1, 1.6, 2.2],
      [3, 3, 4.6, 3.1],
      [6, 0, 1.6, 1.2],
      [-2, 8, 3, 1.8],
      [7, -7, 1.6, 1.3],
      [-9, 6, 1.4, 1.4],
    ];
    const dark = [
      [-6, -4],
      [-5, -4],
      [2, 3],
      [3, 3],
      [3, 4],
      [-2, 8],
    ];
    for (let dy = -r - 1; dy <= r + 1; dy++)
      for (let dx = -r - 1; dx <= r + 1; dx++) {
        if (!inD(dx, dy)) continue;
        let c = P.moon[3];
        // a little brighter toward the upper right
        if (inD(dx - 3, dy + 3) && (dx - 4) * (dx - 4) + (dy + 4) * (dy + 4) < 46) c = P.moon[4];
        for (const k of craters) {
          const ex = (dx - k[0]) / k[2];
          const ey = (dy - k[1]) / k[3];
          if (ex * ex + ey * ey <= 1) c = P.moon[2];
        }
        // lower-left limb darkening (2 px)
        if (!inD(dx - 1.5, dy + 1.5)) c = P.moon[2];
        if (!inD(dx - 0.7, dy + 0.7) && dx < 0 && dy > 0) c = P.moon[1];
        im.set(MOON.x + dx, MOON.y + dy, c);
      }
    for (const p of dark) im.set(MOON.x + p[0], MOON.y + p[1], P.moon[1]);
    // light crater rims (lower-right edge of the bigger maria)
    im.set(MOON.x - 3, MOON.y - 2, P.moon[4]);
    im.set(MOON.x + 6, MOON.y + 5, P.moon[4]);
    im.set(MOON.x + 7, MOON.y + 4, P.moon[4]);
    return im.canvas();
  }

  // ------------------------------------------------------------------
  // Cloud layers
  // ------------------------------------------------------------------
  const LAYERS = [
    {
      id: 'far',
      z: 3,
      y: 86,
      w: 480,
      h: 46,
      k: 1,
      pal: [mix(P.night[3], P.violet[2], 0.55), mix(P.night[4], P.violet[2], 0.55), mix(P.night[4], P.violet[3], 0.6), mix(P.night[5], P.violet[4], 0.55)],
      gen: genFar,
    },
    {
      id: 'mid',
      z: 5,
      y: 26,
      w: 600,
      h: 84,
      k: 1,
      pal: [mix(P.night[2], P.night[3], 0.4), mix(P.night[3], P.violet[2], 0.3), mix(P.night[4], P.violet[2], 0.35), mix(P.night[5], P.violet[3], 0.35)],
      gen: genMid,
    },
    {
      id: 'near',
      z: 7,
      y: 0,
      w: 480,
      h: 46,
      k: 2,
      pal: [mix(P.night[1], P.night[2], 0.35), mix(P.night[2], P.violet[1], 0.3), mix(P.night[3], P.violet[1], 0.35), mix(P.night[3], P.violet[2], 0.45)],
      gen: genNear,
    },
  ];

  function genNear(rng, w, h) {
    const tn = new Tones(w, h);
    // the overcast ceiling: one long mass with a lumpy underside (wraps)
    const mass = [];
    for (let x = -20; x < w + 20; x += 20 + rng() * 12) mass.push([x, 1 + rng() * 4, 18 + rng() * 10, 9 + rng() * 4, undefined, rng() < 0.35]);
    cloud(tn, mass, false, 3);
    // hanging lumps, in small groups, painted front-to-back by depth
    const groups = [];
    for (let i = 0; i < 9; i++) {
      const gx = (i + rng() * 0.6) * (w / 9);
      const deep = rng() < 0.4;
      const g = [];
      const n = 2 + Math.floor(rng() * 3);
      for (let j = 0; j < n; j++) {
        const ry = 3 + rng() * (deep ? 5 : 3);
        g.push([gx + j * (7 + rng() * 6), 12 + rng() * 5 + (deep ? 6 : 0) - ry * 0.3, ry * (1.5 + rng() * 0.8), ry, undefined, j > 0]);
      }
      groups.push(g);
    }
    groups.sort((a, b) => a[0][1] - b[0][1]);
    for (const g of groups) cloud(tn, g, true, 2);
    tidy(tn, 2);
    return tn;
  }

  function genMid(rng, w, h) {
    const tn = new Tones(w, h);
    const clumps = [
      // [x, width, baseY (tile-local)] — two ride high enough to cross the moon
      [20, 96, 42],
      [175, 64, 68],
      [300, 112, 47],
      [458, 80, 74],
    ];
    for (const c of clumps) {
      const x0 = c[0] + rng() * 20;
      const cw = c[1];
      const yb = c[2];
      // back layer: a lower-contrast bank peeking out above / behind
      const back = [];
      const nb = Math.max(3, Math.round(cw / 16));
      for (let i = 0; i < nb; i++) {
        const u = (i + 0.5) / nb;
        const hump = Math.sin(Math.PI * u);
        const ry = 3 + hump * 5 + rng() * 2;
        back.push([x0 + cw * (0.1 + 0.75 * u), yb - 7 - hump * 7 - rng() * 3, ry * 1.7, ry, yb - 4, false]);
      }
      cloud(tn, back, true, 2);
      // front body: big top bumps, flat-ish lumpy bottom
      const body = [];
      const n = Math.max(4, Math.round(cw / 12));
      for (let i = 0; i < n; i++) {
        const u = (i + 0.5) / n;
        const hump = Math.sin(Math.PI * Math.pow(u, 0.8));
        const ry = 3 + hump * 7 + rng() * 2.5;
        body.push([x0 + u * cw + (rng() - 0.5) * 5, yb - ry * 0.55 - rng() * 2, ry * (1.3 + rng() * 0.5), ry, yb + (rng() < 0.3 ? 2 : 0), rng() < 0.4]);
      }
      cloud(tn, body, true, 3);
      // a trailing streak beside the clump
      const sx = x0 + (rng() < 0.5 ? cw * 0.8 : -cw * 0.15) + rng() * 8;
      cloud(tn, [[sx, yb + 1, 14 + rng() * 12, 2, yb + 1, false]], true, 1);
    }
    tidy(tn, 2);
    return tn;
  }

  function genFar(rng, w, h) {
    const tn = new Tones(w, h);
    // three rows of long, flat stratus banks, back to front
    const rows = [
      // [y (tile-local), ry range, rx range, count]
      [10, [1.5, 2.5], [14, 30], 6],
      [24, [2.5, 4], [22, 40], 7],
      [34, [3, 5], [26, 46], 6],
    ];
    for (const r of rows) {
      for (let i = 0; i < r[3]; i++) {
        const cx = (i + rng() * 0.7) * (w / r[3]);
        const ry = r[1][0] + rng() * (r[1][1] - r[1][0]);
        const rx = r[2][0] + rng() * (r[2][1] - r[2][0]);
        const base = Math.round(r[0] + rng() * 4);
        const bank = [[cx, base - ry * 0.4, rx, ry, base, false]];
        // a few lumps on top of the bigger banks
        if (ry > 2.6) {
          const nl = 1 + Math.floor(rng() * 3);
          for (let j = 0; j < nl; j++) {
            const lr = ry * (0.7 + rng() * 0.6);
            bank.push([cx + (rng() - 0.5) * rx, base - ry * 0.6 - lr * 0.5, lr * (1.6 + rng()), lr, base, true]);
          }
        }
        cloud(tn, bank, true, 2);
      }
    }
    tidy(tn, 2);
    return tn;
  }

  // moonlit variants: [shadow, base, light, rim] mixed toward moon colours
  const LIT_K = [
    [0.05, 0.09, 0.16, 0.32],
    [0.1, 0.17, 0.3, 0.55],
    [0.2, 0.3, 0.48, 0.8],
  ];
  // moonlight region (screen space) + dithered radial masks for 3 levels
  const MR = { x: MOON.x - 72, y: 0, w: 144, h: MOON.y + 72 };
  const LIT_R = [
    [64, 10],
    [40, 7],
    [22, 4],
  ];
  // lightning region (center chosen at init where a horizon bank sits)
  const FLASH = { x: 0, y: 64, w: 120, h: 96, cx: 90, cy: 112, t0: 0.62 };
  const FLASH_K = [
    [0.16, 0.24, 0.34, 0.5],
    [0.28, 0.4, 0.52, 0.68],
    [0.42, 0.55, 0.68, 0.82],
  ];
  const FLASH_COL = mix(P.night[9], P.violet[6], 0.35);

  function radialMask(w, h, cx, cy, R, soft) {
    const im = new Img(w, h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const dx = x - cx;
        const dy = (y - cy) * 1.15;
        const d = Math.sqrt(dx * dx + dy * dy) + (HD.bayer(x, y) - 0.5) * soft;
        if (d < R) im.set(x, y, '#ffffff');
      }
    return im.canvas();
  }

  let tmp = null;
  let tctx = null;
  /** draw `tile` (scrolled by off) through `mask` into region R of the main buffer */
  function masked(ctx, tile, Ly, off, R, mask) {
    if (Ly.y + Ly.h <= R.y || Ly.y >= R.y + R.h) return;
    tctx.globalCompositeOperation = 'source-over';
    tctx.clearRect(0, 0, R.w, R.h);
    let sx = (((off - R.x) % Ly.w) + Ly.w) % Ly.w;
    if (sx > 0) sx -= Ly.w;
    for (; sx < R.w; sx += Ly.w) tctx.drawImage(tile, sx, Ly.y - R.y);
    tctx.globalCompositeOperation = 'destination-in';
    tctx.drawImage(mask, 0, 0);
    tctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(tmp, 0, 0, R.w, R.h, R.x, R.y, R.w, R.h);
  }
  // whole tiles per loop; the epsilon keeps t and t+LOOP on the same pixel when
// phase*w lands exactly on an integer (float noise would otherwise floor differently)
const layerOff = (t, Ly) => Math.floor(T.phase(t, HD.LOOP / Ly.k) * Ly.w + 1e-6) % Ly.w;

  function drawLayer(g, t, Ly) {
    const ctx = g.ctx;
    const off = layerOff(t, Ly);
    for (let x = off - Ly.w; x < W; x += Ly.w) ctx.drawImage(Ly.cv, x, Ly.y);
    for (let i = 0; i < 3; i++) masked(ctx, Ly.lit[i], Ly, off, MR, Ly.litMask[i]);
  }

  /** lightning envelope 0..3 at time t (0 when idle) */
  function flashLevel(t) {
    if (!HD.flag('lightning', true)) return 0;
    const s = (T.phase(t, HD.LOOP) - FLASH.t0) * HD.LOOP;
    if (s < 0 || s > 0.62) return 0;
    const pulse = (at, amp, dur) => {
      const u = s - at;
      if (u < 0) return 0;
      return amp * Math.exp(-u / dur);
    };
    const v = Math.max(pulse(0, 1, 0.05), pulse(0.15, 0.55, 0.04), pulse(0.31, 0.85, 0.09));
    return v > 0.62 ? 3 : v > 0.3 ? 2 : v > 0.1 ? 1 : 0;
  }

  // ------------------------------------------------------------------
  // Distant landscape (baked)
  // ------------------------------------------------------------------
  const HILL_A = mix(P.night[4], P.violet[3], 0.4);
  const HILL_B = mix(P.night[3], P.violet[2], 0.4);
  const PINE = mix(P.night[2], P.violet[1], 0.3);
  const CHAPEL = mix(HILL_B, PINE, 0.35);
  const CHAPEL_WIN = { x: 67, y: 133 };
  const COTTAGES = [];
  const LAND_Y = 108;

  function bakeLand(rng) {
    const im = new Img(W, 210 - LAND_Y);
    const ph = [];
    for (let i = 0; i < 9; i++) ph.push(rng() * 6.283);
    const gauss = (x, c, s) => Math.exp(-((x - c) / s) * ((x - c) / s));
    const yA = (x) => {
      let y = 156 + 5 * Math.sin(x / 41 + ph[0]) + 2.6 * Math.sin(x / 15 + ph[1]) + 1.2 * Math.sin(x / 6.7 + ph[2]);
      y -= 24 * gauss(x, 64, 42) + 9 * gauss(x, 318, 46) + 6 * gauss(x, 470, 30);
      if (x > 40 && x < 96) y = Math.min(y, 139 + Math.abs(x - 64) * 0.06);
      return y;
    };
    const yB = (x) => 171 + 4 * Math.sin(x / 31 + ph[3]) + 2.2 * Math.sin(x / 12 + ph[4]) - 7 * gauss(x, 150, 42) - 6 * gauss(x, 438, 46) + 4 * gauss(x, 60, 30);
    const yC = (x) => 191 + 2.5 * Math.sin(x / 23 + ph[5]) + 1.2 * Math.sin(x / 8.5 + ph[6]);
    const S = (x, y, c) => im.set(x, y - LAND_Y, c);
    const rimA = mix(HILL_A, P.moon[0], 0.14);
    const hazeA = mix(HILL_A, P.violet[4], 0.4);
    const rimB = mix(HILL_B, P.moon[0], 0.12);
    const hazeB = mix(HILL_B, HILL_A, 0.6);
    // far hazy hills
    for (let x = 0; x < W; x++) {
      const top = Math.round(yA(x));
      const bTop = Math.round(yB(x));
      for (let y = top; y < 210; y++) {
        let c = HILL_A;
        // mist settles at the foot of the far hills
        const f = (y - (bTop - 7)) / 8;
        if (f > 0 && HD.bayer(x, y) < f * 0.6) c = hazeA;
        S(x, y, c);
      }
      if (x > 250 || HD.bayer(x, 0) < 0.5) S(x, top, rimA);
    }
    // the chapel on the left hill: a dark silhouette, moon-rimmed on the right
    const ch = (x, y) => S(x, y, CHAPEL);
    const base = 140;
    for (let y = 130; y <= base; y++) for (let x = 57; x <= 75; x++) ch(x, y); // nave
    for (let i = 0; i <= 6; i++) for (let x = 56 + i; x <= 76 - i; x++) ch(x, 129 - i); // gable roof
    for (let y = 120; y <= base; y++) for (let x = 49; x <= 56; x++) ch(x, y); // tower
    for (let x = 48; x <= 57; x++) ch(x, 120); // tower cornice
    // spire: tapering to a 1px needle
    const spire = [4, 3, 3, 2, 2, 2, 1, 1, 1, 0, 0, 0, 0];
    for (let i = 0; i < spire.length; i++) for (let x = 52 - spire[i]; x <= 52 + spire[i] + (i < 6 ? 1 : 0); x++) ch(x, 119 - i);
    for (let y = 103; y <= 106; y++) ch(52, y); // cross
    ch(51, 104);
    ch(53, 104);
    // a small apse on the far end
    for (let y = 133; y <= base; y++) for (let x = 76; x <= 78; x++) ch(x, y);
    // dark belfry slit
    S(52, 123, PINE);
    S(53, 123, PINE);
    S(52, 124, PINE);
    S(53, 124, PINE);
    // moon rim on the right-facing edges
    const rimCh = mix(CHAPEL, P.moon[0], 0.2);
    for (let i = 1; i <= 6; i++) S(76 - i, 129 - i, rimCh);
    for (let y = 134; y <= 138; y++) S(78, y, rimCh);
    for (let y = 121; y <= 128; y++) S(56, y, rimCh);
    for (let i = 1; i < 9; i++) S(52 + spire[i] + (i < 6 ? 1 : 0), 119 - i, rimCh);
    // graves and a bare far tree beside the chapel
    for (const gx of [82, 86, 44]) {
      S(gx, base - 1, CHAPEL);
      S(gx, base - 2, CHAPEL);
      S(gx + 1, base - 1, CHAPEL);
    }
    for (let y = 128; y <= base; y++) S(91, y, CHAPEL);
    S(90, 131, CHAPEL);
    S(89, 130, CHAPEL);
    S(89, 129, CHAPEL);
    S(92, 132, CHAPEL);
    S(93, 131, CHAPEL);
    S(93, 130, CHAPEL);
    S(94, 129, CHAPEL);
    S(91, 127, CHAPEL);
    S(90, 135, CHAPEL);
    // faint warm spill beside the window (static); the window itself is drawn per frame
    S(CHAPEL_WIN.x - 1, CHAPEL_WIN.y + 1, mix(CHAPEL, P.amber[2], 0.25));
    S(CHAPEL_WIN.x + 1, CHAPEL_WIN.y + 1, mix(CHAPEL, P.amber[2], 0.25));
    // nearer, darker hills
    for (let x = 0; x < W; x++) {
      const top = Math.round(yB(x));
      const cTop = Math.round(yC(x));
      for (let y = top; y < 210; y++) {
        let c = HILL_B;
        const f = (y - (cTop - 12)) / 10;
        if (f > 0 && HD.bayer(x + 2, y) < f * 0.45) c = hazeB;
        S(x, y, c);
      }
      if (x > 300 && HD.bayer(x, 1) < 0.75) S(x, top, rimB);
    }
    // far cottage lights sit in the dark hills
    COTTAGES.length = 0;
    for (const cx of [134, 452]) COTTAGES.push({ x: cx, y: Math.round(yB(cx)) + 4 });
    for (const c of COTTAGES) {
      S(c.x - 1, c.y - 1, mix(HILL_B, P.stone[2], 0.6));
      S(c.x, c.y - 1, mix(HILL_B, P.stone[2], 0.6));
      S(c.x + 1, c.y, mix(HILL_B, P.stone[2], 0.4));
    }
    // pine line: clumps of tiered pines with varied heights and a few gaps
    const rimC = mix(PINE, P.moon[0], 0.12);
    for (let x = 0; x < W; x++) for (let y = Math.round(yC(x)); y < 210; y++) S(x, y, PINE);
    let x = -6;
    while (x < W + 6) {
      const dens = Math.sin(x / 37 + ph[7]) + 0.6 * Math.sin(x / 13 + ph[8]);
      if (dens < -0.9) {
        x += 6 + Math.round(rng() * 6);
        continue;
      }
      const h = Math.round(5 + rng() * 7 + Math.max(0, dens) * 5);
      const hw = Math.max(2, Math.round(h * 0.3));
      const b = Math.round(yC(x)) + 1;
      for (let r = 0; r <= h; r++) {
        const tier = Math.floor(r / 3);
        const half = r < 2 ? 0 : Math.min(hw, Math.floor(tier * 0.75 + (r % 3) * 0.55));
        const y = b - h + r;
        for (let xx = x - half; xx <= x + half; xx++) S(xx, y, PINE);
        if (x > 300 && r > 1 && r % 3 !== 0 && half > 0) S(x + half, y, rimC);
      }
      x += 3 + Math.round(rng() * 4);
    }
    return im.canvas();
  }

  // ------------------------------------------------------------------
  // Bats
  // ------------------------------------------------------------------
  const BAT_FRAMES = [
    ['x.....x', '.x...x.', '..xxx..', '...x...', '.......'],
    ['.......', '..x.x..', 'xxxxxxx', '...x...', '.......'],
    ['.......', '...x...', '..xxx..', '.x...x.', 'x.....x'],
  ];
  const BAT_SEQ = [0, 1, 2, 1];
  let batSprites = null;
  const BAT_PERIOD = 80;
  const BAT_FLIGHT = 11; // seconds the pair is on screen
  const BAT_PATHS = [
    // right edge, up past the moon, out through the top
    [500, 104, 250, -14],
    // down from the top, across the moon, out the right edge
    [300, -12, 496, 92],
  ];

  function drawBats(g, t) {
    const c = T.cycle(t, 0, BAT_PERIOD, 9103);
    const s = c.age * c.P;
    if (s > BAT_FLIGHT + 1) return;
    const path = BAT_PATHS[c.rnd(1) < 0.6 ? 0 : 1];
    const lift = (c.rnd(2) - 0.5) * 14;
    const fr = Math.round(T.step(t, 10) * 10);
    for (let b = 0; b < 2; b++) {
      const sb = s - b * 0.7;
      if (sb < 0) continue;
      const u = sb / BAT_FLIGHT;
      if (u > 1) continue;
      let x = path[0] + (path[2] - path[0]) * u + b * 7;
      let y = path[1] + (path[3] - path[1]) * u + lift + b * 5;
      y += 4 * Math.sin(u * 6.283 * 2.5 + b * 1.7) + 1.5 * Math.sin(u * 6.283 * 9 + b);
      const f = BAT_SEQ[(fr + b * 2) & 3];
      g.sprite(batSprites[f], Math.round(x) - 3, Math.round(y) - 2);
    }
  }

  // ------------------------------------------------------------------
  // module
  // ------------------------------------------------------------------
  let skyCv = null;
  let landCv = null;
  let flashTiles = null;
  let flashMasks = null;

  HD.module('bg', {
    init() {
      const rng = HD.rng(7331);
      skyCv = bakeSky();
      const litMasks = LIT_R.map((r) => radialMask(MR.w, MR.h, MOON.x - MR.x, MOON.y - MR.y, r[0], r[1]));
      for (const Ly of LAYERS) {
        Ly.tn = Ly.gen(HD.rng(Math.floor(rng() * 1e9)), Ly.w, Ly.h);
        Ly.cv = tonesToCanvas(Ly.tn, Ly.pal);
        Ly.lit = LIT_K.map((ks, i) => {
          const tgt = i < 2 ? P.moon[0] : P.moon[1];
          const pal = shade(Ly.pal, tgt, ks);
          pal[3] = mix(Ly.pal[3], i === 0 ? P.moon[0] : i === 1 ? P.moon[1] : P.moon[2], ks[3]);
          return tonesToCanvas(Ly.tn, pal);
        });
        Ly.litMask = litMasks;
      }
      tmp = HD.canvas(Math.max(MR.w, FLASH.w), Math.max(MR.h, FLASH.h), true);
      tctx = tmp.getContext('2d');
      tctx.imageSmoothingEnabled = false;

      // lightning: light the horizon bank that sits on the left at flash time
      const far = LAYERS[0];
      const off = layerOff(FLASH.t0 * HD.LOOP, far);
      let best = -1;
      for (let cx = 50; cx <= 140; cx += 2) {
        let n = 0;
        for (let x = cx - 26; x <= cx + 26; x++) for (let y = 14; y < 42; y++) if (far.tn.get(x - off, y)) n++;
        if (n > best) {
          best = n;
          FLASH.cx = cx;
        }
      }
      FLASH.x = FLASH.cx - (FLASH.w >> 1);
      flashTiles = FLASH_K.map((ks) => tonesToCanvas(far.tn, shade(far.pal, FLASH_COL, ks)));
      flashMasks = [radialMask(FLASH.w, FLASH.h, FLASH.cx - FLASH.x, FLASH.cy - FLASH.y, 50, 18), radialMask(FLASH.w, FLASH.h, FLASH.cx - FLASH.x, FLASH.cy - FLASH.y, 26, 10)];

      landCv = bakeLand(HD.rng(4242));
      const batCol = P.night[0];
      batSprites = BAT_FRAMES.map((rows) => HD.sprite(rows, { x: batCol }));
    },
    passes: [
      {
        layer: 'bg',
        z: 0,
        id: 'sky',
        draw(g) {
          g.ctx.drawImage(skyCv, 0, 0);
        },
      },
      { layer: 'bg', z: 3, id: 'clouds-far', draw: (g, t) => drawLayer(g, t, LAYERS[0]) },
      { layer: 'bg', z: 5, id: 'clouds-mid', draw: (g, t) => drawLayer(g, t, LAYERS[1]) },
      { layer: 'bg', z: 7, id: 'clouds-near', draw: (g, t) => drawLayer(g, t, LAYERS[2]) },
      {
        layer: 'bg',
        z: 8,
        id: 'lightning',
        draw(g, t) {
          const lv = flashLevel(t);
          if (!lv) return;
          const far = LAYERS[0];
          const off = layerOff(t, far);
          masked(g.ctx, flashTiles[Math.max(0, lv - 2)], far, off, FLASH, flashMasks[0]);
          masked(g.ctx, flashTiles[lv - 1], far, off, FLASH, flashMasks[1]);
        },
      },
      {
        layer: 'bg',
        z: 10,
        id: 'land',
        draw(g, t) {
          g.ctx.drawImage(landCv, 0, LAND_Y);
          // chapel window: one tiny warm pane, breathing very slowly
          const v = T.noise(t, 9, 77);
          g.px(CHAPEL_WIN.x, CHAPEL_WIN.y, v > 0.35 ? P.amber[5] : P.amber[4]);
          g.px(CHAPEL_WIN.x, CHAPEL_WIN.y + 1, v > 0.7 ? P.amber[5] : P.amber[4]);
          for (let i = 0; i < COTTAGES.length; i++) {
            const c = COTTAGES[i];
            const k = T.noise(t, 13, 91 + i);
            g.px(c.x, c.y, k > 0.5 ? P.amber[4] : P.amber[3]);
          }
        },
      },
      { layer: 'bg', z: 18, id: 'bats', draw: drawBats },
    ],
  });
})();

</script>
    <script>
/* src/ground.js */
/*
 * ground — the slab Rainy Hollow sits on.
 *   scene z5  baked top face (wet grass, mud, stepping stones, puddle beds,
 *             leaves, pebbles, the grassy front lip) — relit by the lightmap
 *             + baked cross-section (soil strata, pebbles, tree roots, the
 *             coffin, bones and a skull) — drawn emissive so firelight on the
 *             top face never leaks onto the cut face; it stays dark and cold
 *   scene z6  a tiny worm wiggling in the topsoil (4 fps, loop-safe)
 * Everything static is rasterised once in init() into two canvases; a frame
 * is two blits plus a handful of worm pixels.
 */
(function () {
  'use strict';
  const HD = window.HD;
  const P = HD.PAL;
  const L = HD.layout;
  const T = HD.time;
  const GR = L.ground;
  const BACK = GR.back; // 200
  const FRONT = GR.front; // 238 (first row of the cut face)
  const BOT = GR.bottom; // 270
  const W = 480;
  const Y0 = BACK - 6; // raster top: tufts poke above the back edge
  const H = BOT - Y0;
  const CUT_LIT = FRONT + 2; // turf rows 238,239 are lit; the cut face below is not

  const clamp = HD.clamp;
  const bayer = HD.bayer;
  const mix = HD.color.mix;

  // ------------------------------------------------------------------
  // init-time raster (colour strings) + flags
  // ------------------------------------------------------------------
  let C = null; // colour per pixel
  let LIT = null; // 1 = relit (top face), 0 = emissive (cut face)
  let M = null; // mask bits
  const PUD = 1;
  const RIM = 2;
  const STONE = 4;
  const MUD = 8;
  const COF = 16;
  const ROOT = 32;
  const BONE = 64;
  const FIRE = 128;

  const at = (x, y) => {
    x = Math.round(x);
    y = Math.round(y) - Y0;
    return x < 0 || y < 0 || x >= W || y >= H ? -1 : y * W + x;
  };
  const set = (x, y, c) => {
    const k = at(x, y);
    if (k < 0) return;
    C[k] = c;
    LIT[k] = Math.round(y) < CUT_LIT ? 1 : 0;
  };
  const get = (x, y) => {
    const k = at(x, y);
    return k < 0 ? null : C[k];
  };
  const mask = (x, y) => {
    const k = at(x, y);
    return k < 0 ? 0 : M[k];
  };
  const addMask = (x, y, b) => {
    const k = at(x, y);
    if (k >= 0) M[k] |= b;
  };

  // smooth value noise (init only)
  function vn(x, y, s) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const fx = x - xi;
    const fy = y - yi;
    const u = fx * fx * (3 - 2 * fx);
    const v = fy * fy * (3 - 2 * fy);
    const a = HD.hash(xi, yi, s, 1);
    const b = HD.hash(xi + 1, yi, s, 1);
    const c = HD.hash(xi, yi + 1, s, 1);
    const d = HD.hash(xi + 1, yi + 1, s, 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, y, s) => vn(x, y, s) * 0.6 + vn(x * 2.03, y * 2.03, s + 17) * 0.28 + vn(x * 4.1, y * 4.1, s + 33) * 0.12;
  /** quantise v to an integer ramp index, with a narrow ordered-dither seam */
  function qd(v, x, y, lo, hi, w) {
    let i = Math.floor(v);
    const fr = v - i;
    if (fr > 0.5 + (bayer(x, y) - 0.5) * (w === undefined ? 0.5 : w)) i++;
    return clamp(i, lo, hi);
  }

  // ------------------------------------------------------------------
  // TOP FACE
  // ------------------------------------------------------------------
  const depth = (y) => clamp((y - BACK) / (FRONT - 1 - BACK), 0, 1);

  // mud / trampled areas: ellipses (x, y, rx, ry, strength)
  function mudSpots() {
    const s = [];
    const cf = L.campfire;
    s.push({ x: cf.x, y: cf.base, rx: 30, ry: 8.5, k: 1.15, fire: true });
    const st = L.house.steps;
    s.push({ x: (st.x0 + st.x1) / 2, y: st.y1 + 1, rx: 17, ry: 3.2, k: 1 });
    for (const p of L.puddles) s.push({ x: p.x, y: p.y + 0.5, rx: p.rx + 6, ry: p.ry + 2.6, k: 0.95 });
    s.push({ x: 268, y: 234, rx: 10, ry: 2.5, k: 0.8 });
    s.push({ x: 405, y: 220, rx: 30, ry: 4.5, k: 0.75 }); // bare soil under the tree
    s.push({ x: 60, y: 233, rx: 9, ry: 2.5, k: 0.7 });
    s.push({ x: 128, y: 229, rx: 8, ry: 2, k: 0.7 });
    return s;
  }

  function paintBase() {
    for (let y = BACK; y < FRONT; y++) {
      const d = depth(y);
      for (let x = 0; x < W; x++) {
        const n = fbm(x / 15, y / 4.2, 11);
        let v = 1.35 + d * 2.05 + (n - 0.5) * 2.1;
        if (y < BACK + 3) v -= (BACK + 3 - y) * 0.45;
        // damp, darker patches (flattened wet grass)
        const dp = vn(x / 21, y / 4.5, 23);
        if (dp > 0.7) v -= 1;
        set(x, y, P.moss[qd(v, x, y, 1, 4, 0.22)]);
      }
    }
    // despeckle: lone pixels take their neighbours' colour
    for (let y = BACK + 1; y < FRONT - 1; y++)
      for (let x = 1; x < W - 1; x++) {
        const c = get(x, y);
        const l = get(x - 1, y);
        const r = get(x + 1, y);
        if (c !== l && c !== r && l === r && c !== get(x, y - 1) && c !== get(x, y + 1)) set(x, y, l);
      }
  }

  function paintMud() {
    for (const m of mudSpots()) {
      const x0 = Math.floor(m.x - m.rx - 3);
      const x1 = Math.ceil(m.x + m.rx + 3);
      const y0 = Math.max(BACK + 2, Math.floor(m.y - m.ry - 2));
      const y1 = Math.min(FRONT - 1, Math.ceil(m.y + m.ry + 2));
      for (let y = y0; y <= y1; y++)
        for (let x = x0; x <= x1; x++) {
          const dx = (x - m.x) / m.rx;
          const dy = (y - m.y) / m.ry;
          const e = Math.sqrt(dx * dx + dy * dy);
          const n = vn(x / 4, y / 1.6, 57);
          const v = (1 - e) * m.k + (n - 0.5) * 0.55;
          if (v < 0.08) continue;
          addMask(x, y, MUD);
          let c;
          const n2 = vn(x / 3, y / 1.3, 59);
          if (v < 0.2) c = n2 > 0.5 ? P.soil[4] : P.moss[1];
          else if (n2 > 0.72) c = P.soil[5];
          else if (n2 < 0.3) c = P.soil[3];
          else c = P.soil[4];
          if (m.fire) {
            addMask(x, y, FIRE);
            // trampled, scorched ground around the ring
            const dd = Math.sqrt(((x - m.x) / 17) ** 2 + ((y - m.y + 1) / 5) ** 2);
            if (dd < 0.85) c = n2 > 0.6 ? P.soil[3] : P.soil[2];
          }
          set(x, y, c);
        }
    }
    // wet glints in the mud: short cold strokes
    const r = HD.rng(611);
    for (let k = 0; k < 140; k++) {
      const x = Math.floor(r() * W);
      const y = BACK + 3 + Math.floor(r() * (FRONT - BACK - 4));
      if (!(mask(x, y) & MUD) || mask(x, y) & (PUD | RIM)) continue;
      if (get(x, y) !== P.soil[4] && get(x, y) !== P.soil[5]) continue;
      const len = r() < 0.6 ? 2 : 1;
      for (let i = 0; i < len; i++) if (mask(x + i, y) & MUD && !(mask(x + i, y) & (PUD | RIM))) set(x + i, y, i ? P.stone[3] : P.stone[4]);
    }
  }

  /** the engine's puddle ellipse: same row widths as engine reflections() */
  function pudRows(p) {
    const rows = [];
    const ry = Math.round(p.ry);
    const rx = Math.round(p.rx);
    for (let dy = -ry; dy <= ry; dy++) {
      const t = (dy) / (ry + 0.5);
      const kk = 1 - t * t;
      if (kk <= 0) continue;
      rows.push({ y: Math.round(p.y) + dy, hw: Math.floor((rx + 0.4) * Math.sqrt(kk)), dy, ry });
    }
    return rows;
  }

  function paintPuddles() {
    for (const p of L.puddles) {
      const cx = Math.round(p.x);
      const rows = pudRows(p);
      for (const r of rows) for (let x = cx - r.hw; x <= cx + r.hw; x++) addMask(x, r.y, PUD);
      // muddy bank + 1px dark rim just outside the water
      for (const r of rows) {
        for (let x = cx - r.hw - 2; x <= cx + r.hw + 2; x++)
          for (let oy = -1; oy <= 1; oy++) {
            const y = r.y + oy;
            if (mask(x, y) & PUD) continue;
            const near = mask(x - 1, y) & PUD || mask(x + 1, y) & PUD || mask(x, y - 1) & PUD || mask(x, y + 1) & PUD;
            if (!near) continue;
            addMask(x, y, RIM);
            set(x, y, y > p.y ? P.soil[1] : P.soil[2]);
          }
      }
      for (const r of rows) {
        // banks: one lighter wet-mud pixel outside the rim at the ends of each row
        const yb = r.y;
        for (const sx of [-1, 1]) {
          const xb = cx + sx * (r.hw + 2);
          if (!(mask(xb, yb) & (PUD | RIM))) set(xb, yb, P.soil[4]);
        }
      }
      // bed: still dark water, a touch lighter toward the far bank, cold sheen
      for (const r of rows) {
        for (let x = cx - r.hw; x <= cx + r.hw; x++) {
          let c = P.night[2];
          if (r.dy < 0) c = P.night[3];
          if (r.dy > 0 && Math.abs(x - cx) > r.hw - 2) c = P.night[1];
          set(x, r.y, c);
        }
      }
      const top = rows[0];
      const sh = Math.round(top.hw * 0.45);
      const sx0 = cx - Math.round(top.hw * 0.35);
      for (let x = sx0; x < sx0 + sh; x++) set(x, top.y + 1, P.night[4]);
    }
  }

  /** one grass tuft: a little fan of blades rooted at (x, y) */
  function tuft(x, y, d, r, dark) {
    const n = 2 + Math.floor(r() * 2.2 + d * 1.6);
    const hmax = 1 + d * 3.4;
    const k0 = dark ? 1 : d < 0.3 ? 2 : 3;
    const half = (n - 1) / 2;
    for (let b = 0; b < n; b++) {
      if (r() < 0.12) continue;
      const off = b - half;
      const bx = Math.round(x + off);
      const centre = 1 - Math.abs(off) / (half + 1);
      const h = Math.max(1, Math.round(hmax * (0.45 + 0.55 * centre) * (0.75 + r() * 0.5)));
      const fan = h >= 3 ? Math.sign(Math.round(off)) : 0;
      const wind = h >= 2 && r() < 0.45 ? 1 : 0;
      for (let j = 0; j < h; j++) {
        const yy = y - j;
        let xx = bx;
        if (j === h - 1) xx += fan || wind;
        else if (j >= 3 && fan) xx += fan;
        const m = mask(xx, yy);
        if (m & (PUD | RIM | STONE)) continue;
        let ci = k0;
        if (j === h - 1 && h > 1) ci = d > 0.35 ? k0 + 2 : k0 + 1;
        else if (j >= h / 2) ci = k0 + 1;
        if (dark) ci = Math.min(ci, 2);
        if (!dark && j === h - 1 && d > 0.55 && r() < 0.22) ci = 6;
        set(xx, yy, P.moss[clamp(ci, 0, 6)]);
      }
      // a darker root pixel grounds the blade
      if (h >= 2 && !(mask(bx, y + 1) & (PUD | RIM | STONE)) && y + 1 < FRONT) set(bx, y + 1, P.moss[Math.max(1, k0 - 1)]);
    }
  }

  function paintGrass() {
    const r = HD.rng(4242);
    for (let y = BACK - 1; y < FRONT; y++) {
      const d = depth(y);
      const count = Math.round(W * (0.06 + 0.13 * d));
      for (let k = 0; k < count; k++) {
        const x = Math.floor(r() * W);
        const cl = vn(x / 8, y / 3, 77);
        if (r() > cl * 1.7 - 0.55) continue;
        const m = mask(x, y);
        if (m & (PUD | RIM | STONE)) continue;
        if (m & MUD && r() < 0.85) continue;
        if (m & FIRE) continue;
        tuft(x, y, d, r, y < BACK + 3);
      }
    }
  }

  // ---- stepping-stone path -----------------------------------------------
  function pathPoint(s) {
    const pts = L.path;
    let acc = 0;
    for (let i = 0; i + 1 < pts.length; i++) {
      const a = pts[i];
