    <script>
/* src/weather.js */
/*
 * weather — the cold half of the palette and the main motion.
 *
 *   bg  z22   far rain: many short dim 1px streaks behind the house
 *   fx  z26   puddle ripples (expanding flat rings inside layout.puddles)
 *   fx  z27   splashes: where mid drops landed on the ground band, random
 *             pops along layout.surfaces, tombstone and jack-o'-lantern tops
 *   fx  z42   mid rain (lands at a random depth on the ground band) + eave drips
 *   fx  z66   near rain: sparse, long, fast; crosses the whole frame
 *
 * Every drop is a stateless HD.time.cycle life with per-life random x, so the
 * whole thing is a pure function of t and loops seamlessly. Each drop takes
 * its colour from the lightmap where it is (HD.lights.lum), quantised to a
 * few precomputed steps: cold blue-grey in the dark, warming through
 * PAL.warmrain around the campfire, the windows and the porch lantern.
 */
(function () {
  'use strict';
  const HD = window.HD;
  const P = HD.PAL;
  const LY = HD.layout;
  const T = HD.time;
  const S = LY.wind.slant;
  const W = HD.W;
  const H = HD.H;
  const mix = HD.color.mix;
  const hash = HD.hash;
  const lum = HD.lights.lum;

  const G0 = LY.ground.houseBase; // 206: nearest ground behind which mid drops never land
  const G1 = LY.ground.front; // 238: front lip
  const TS = LY.titleSafe;
  const inTitle = (x, y) => x >= TS.x0 - 4 && x <= TS.x1 + 4 && y >= TS.y0 - 4 && y <= TS.y1 + 4;

  // ------------------------------------------------------------------
  // colour tables: [tone][lightLevel] -> css string (all precomputed)
  // ------------------------------------------------------------------
  const LVT = [0.035, 0.08, 0.15, 0.25, 0.38, 0.56];
  function lvOf(l) {
    let k = 0;
    while (k < 6 && l >= LVT[k]) k++;
    return k;
  }
  /** cold colour -> 7 light levels warming through PAL.warmrain */
  function warmRamp(cold, maxW, wk) {
    const out = [cold];
    for (let k = 1; k <= 6; k++) {
      const wi = Math.min(maxW, Math.ceil((k * maxW) / 6));
      out.push(mix(cold, P.warmrain[wi], Math.min(0.9, (0.26 + 0.12 * k) * wk)));
    }
    return out;
  }
  const R = P.rain;
  const FAR = [
    warmRamp(P.night[5], 1, 0.5),
    warmRamp(mix(P.night[5], R[0], 0.8), 1, 0.55),
    warmRamp(mix(R[0], R[1], 0.4), 2, 0.6),
  ];
  const MID = [warmRamp(mix(R[0], R[1], 0.6), 3, 0.9), warmRamp(mix(R[1], R[2], 0.3), 4, 1), warmRamp(mix(R[1], R[2], 0.7), 4, 1)];
  const NEAR = [warmRamp(R[1], 3, 1), warmRamp(mix(R[1], R[2], 0.7), 3, 1), warmRamp(mix(R[2], R[3], 0.45), 4, 1)];
  const SPL = [warmRamp(mix(R[0], R[1], 0.6), 2, 0.9), warmRamp(R[2], 3, 1), warmRamp(mix(R[2], R[3], 0.6), 4, 1)];
  const DRP = [warmRamp(R[1], 3, 1), warmRamp(R[2], 3, 1), warmRamp(R[3], 4, 1)];
  const RIP = [warmRamp(mix(R[0], R[1], 0.7), 2, 0.7), warmRamp(mix(R[1], R[2], 0.45), 3, 0.8), warmRamp(mix(R[2], R[3], 0.3), 3, 0.85)];

  // ------------------------------------------------------------------
  // density breathes slowly between ~80% and 100%; decided per life
  // (at the life's start time) so a drop never pops in or out mid-fall
  // ------------------------------------------------------------------
  const dens = (ts) => 0.8 + 0.2 * T.noise(ts, 47, 6119);

  // ------------------------------------------------------------------
  // drawing helpers
  // ------------------------------------------------------------------
  /** 1px slanted streak along x = ax + S*y, from row y0 to y1 (inclusive), as clean vertical runs */
  function streak(g, ax, y0, y1, c) {
    if (y0 < 0) y0 = 0;
    if (y1 >= H) y1 = H - 1;
    if (y1 < y0) return;
    let rs = y0;
    let rx = Math.round(ax + S * y0);
    for (let y = y0 + 1; y <= y1; y++) {
      const x = Math.round(ax + S * y);
      if (x !== rx) {
        g.rect(rx, rs, 1, y - rs, c);
        rs = y;
        rx = x;
      }
    }
    g.rect(rx, rs, 1, y1 - rs + 1, c);
  }

  // crown splashes: per size, per frame, [dx, dy, tone]
  const CROWN = [
    // tiny (far ground, roofs)
    [
      [[0, 0, 2], [-1, -1, 1], [1, -1, 1]],
      [[-1, -2, 0], [1, -2, 0]],
    ],
    // small
    [
      [[0, 0, 2], [-1, -1, 1], [1, -1, 1]],
      [[-2, -2, 1], [2, -2, 1], [0, -1, 0]],
      [[-2, -1, 0], [2, -1, 0]],
    ],
    // big (front of the ground band)
    [
      [[-1, 0, 1], [0, 0, 2], [1, 0, 1], [-1, -1, 2], [1, -1, 2]],
      [[-2, -2, 2], [2, -2, 2], [-1, -1, 0], [1, -1, 0], [0, -3, 1]],
      [[-3, -1, 0], [3, -1, 0], [0, -2, 0]],
    ],
  ];
  const SPL_F = 0.042; // seconds per splash frame
  function crown(g, x, y, size, f, tab, lv) {
    const fr = CROWN[size][f];
    if (!fr) return;
    for (let k = 0; k < fr.length; k++) {
      const p = fr[k];
      g.rect(x + p[0], y + p[1], 1, 1, tab[p[2]][lv]);
    }
  }

  // ------------------------------------------------------------------
  // puddles: same footprint as the engine's reflection (row half-widths)
  // ------------------------------------------------------------------
  const PUD = LY.puddles.map((p) => {
    const cx = Math.round(p.x);
    const cy = Math.round(p.y);
    const rx = Math.round(p.rx);
    const ry = Math.round(p.ry);
    const hw = [];
    for (let y = -ry; y <= ry; y++) {
      const dy = y / (ry + 0.5);
      hw.push(Math.floor((rx + 0.4) * Math.sqrt(Math.max(0, 1 - dy * dy))));
    }
    return { cx, cy, rx, ry, hw, n: Math.max(2, Math.round(rx / 6)), rmax: Math.max(3, Math.min(5, Math.round(rx / 4) + 1)) };
  });
  function inPud(pd, x, y) {
    const dy = y - pd.cy;
    if (dy < -pd.ry || dy > pd.ry) return false;
    const dx = x - pd.cx;
    const h = pd.hw[dy + pd.ry];
    return dx >= -h && dx <= h;
  }
  function puddleAt(x, y) {
    for (let k = 0; k < PUD.length; k++) if (inPud(PUD[k], x, y)) return PUD[k];
    return null;
  }
  /** flat 1px elliptical ring (ry ~ rx/3), clipped to a puddle */
  function ering(g, pd, cx, cy, r, c) {
    const ry = r / 3;
    for (let dx = -r; dx <= r; dx++) {
      const h = Math.round(ry * Math.sqrt(Math.max(0, 1 - (dx * dx) / (r * r))));
      const x = cx + dx;
      if (inPud(pd, x, cy - h)) g.rect(x, cy - h, 1, 1, c);
      if (h > 0 && inPud(pd, x, cy + h)) g.rect(x, cy + h, 1, 1, c);
    }
  }

  // ------------------------------------------------------------------
  // geometry mirrored from the finished house/props (for where splashes sit)
  // ------------------------------------------------------------------
  const RF = LY.house.roof;
  const TU = LY.house.turret;
  const CH = LY.house.chimney;
  const PO = LY.house.porch;
  const SAG = 1.6;
  const roofL = (y) => {
    const k = (RF.eave - y) / (RF.eave - RF.peakY);
    return RF.x0 + (RF.peakX - RF.x0) * k + SAG * Math.sin(Math.PI * k);
  };
  const roofR = (y) => {
    const k = (RF.eave - y) / (RF.eave - RF.peakY);
    const xr = RF.x1 - 1;
    return xr - (xr - RF.peakX) * k - SAG * Math.sin(Math.PI * k);
  };
  const coneHW = (y) => {
    const k = (y - TU.peakY) / (TU.top - TU.peakY);
    if (k < 0) return -1;
    return 0.6 + 14.3 * Math.pow(k, 1.35) + 1.6 * Math.pow(HD.smoothstep(0.78, 1, k), 2);
  };
  const TCX = (TU.x0 + TU.x1 - 1) / 2;
  const coneCX = (y) => {
    const k = HD.clamp((TU.peakY + 22 - y) / 22, 0, 1);
    return TCX + 4.2 * k * k;
  };
  const roofTop = (x) => {
    for (let y = RF.peakY; y <= RF.eave; y++) if (Math.round(roofL(y)) <= x && x <= Math.round(roofR(y))) return y;
    return -1;
  };
  const JSZ = { big: [9, 6.6], medium: [7, 5.4], small: [5, 4] };
  const JACKS = LY.jackolanterns.map((j) => {
    const s = JSZ[j.size] || JSZ.small;
    return { x: j.x, cy: Math.round(j.base - s[1] - 0.6), rx: s[0], ry: s[1] };
  });
  const jackTop = (J, x) => {
    const dx = x - J.x;
    if (Math.abs(dx) > J.rx) return -1;
    return Math.round(J.cy - J.ry * Math.sqrt(Math.max(0, 1 - (dx * dx) / ((J.rx + 0.5) * (J.rx + 0.5)))));
  };
  function tombInside(kind) {
    if (kind === 'round')
      return (u, v) => (Math.abs(u) <= 7.5 && v >= 0 && v < 2.5) || (Math.abs(u) <= 6.2 && v >= 0 && (v <= 11 || (u * u) / 40 + ((v - 11) * (v - 11)) / 44 <= 1));
    if (kind === 'cross')
      return (u, v) => (Math.abs(u) <= 5.5 && v >= 0 && v < 3) || (Math.abs(u) <= 1.6 && v >= 0 && v <= 21) || (Math.abs(u) <= 6.2 && v >= 13.5 && v <= 16.6);
    if (kind === 'tall')
      return (u, v) => (Math.abs(u) <= 6.5 && v >= 0 && v < 3) || (Math.abs(u) <= 5.5 && v >= 3 && v < 4.5) || (Math.abs(u) <= 4.5 && v >= 4.5 && v <= 25 + (4.6 - Math.abs(u)) * 1.25);
    return (u, v) => Math.abs(u) <= 5.6 && v >= -3 && (v <= 11 || (Math.abs(u) <= 4.2 && v <= 13.2) || (Math.abs(u) <= 2.4 && v <= 14.4));
  }

  /** splash points along surfaces (flat arrays x, y, size) */
  const SX = [];
  const SY = [];
  function addPt(x, y) {
    SX.push(Math.round(x));
    SY.push(Math.round(y));
  }
  // main roof slopes (skip where the chimney and the turret stand in front)
  for (let y = RF.peakY + 2; y <= RF.eave - 1; y++) {
    const xl = Math.round(roofL(y));
    if (xl < CH.x0 - 2 || xl > CH.x1 + 2) addPt(xl, y);
    const xr = Math.round(roofR(y));
    if (xr < TU.x0 - 3) addPt(xr, y);
  }
  // along the roof's top rows too (rain hits the slates, not only the edge)
  for (let x = RF.x0 + 4; x < RF.x1 - 4; x += 3) {
    if ((x >= CH.x0 - 1 && x <= CH.x1 + 1) || x >= TU.x0 - 2) continue;
    const y = roofTop(x);
    if (y > 0) addPt(x, y);
  }
  // turret cone flanks (every other row: they are steep)
  for (let y = TU.peakY + 6; y <= TU.top - 1; y += 2) {
    const hw = coneHW(y);
    const cx = coneCX(y);
    addPt(cx - hw, y);
    addPt(cx + hw, y);
  }
  // porch roof and chimney cap
  for (let x = PO.x0 + 2; x <= PO.x1 - 3; x++) addPt(x, PO.roofY);
  for (let x = CH.x0; x <= CH.x1 + 1; x++) addPt(x, CH.top);
  // tombstone tops (every other column)
  for (const st of LY.tombstones) {
    const inside = tombInside(st.kind);
    const ang = st.kind === 'leaning' ? 0.22 : 0;
    const sink = st.kind === 'leaning' ? 2 : 0;
    const ca = Math.cos(ang);
    const sa = Math.sin(ang);
    for (let x = st.x - 9; x <= st.x + 9; x += 2) {
      for (let y = st.base - 36; y <= st.base; y++) {
        const dx = x - st.x;
        const dy = st.base + sink - y;
        if (inside(dx * ca - dy * sa, dx * sa + dy * ca)) {
          addPt(x, y);
          break;
        }
      }
    }
  }
  // jack-o'-lantern shoulders (not on the stem)
  for (const J of JACKS) {
    for (let dx = -J.rx + 1; dx <= J.rx - 1; dx += 2) {
      if (Math.abs(dx) <= 1) continue;
      addPt(J.x + dx, jackTop(J, J.x + dx));
    }
  }
  const NS = SX.length;

  // ------------------------------------------------------------------
  // eave drips: each its own period, lands on whatever is below
  // ------------------------------------------------------------------
  const GRAV = 420; // px/s^2
  const DRIPS = LY.drips.map((d, j) => {
    let x = Math.round(d.x);
    let y0 = Math.round(d.y);
    if (Math.abs(y0 - (TU.top + 1)) <= 1) {
      // turret-cone lip: hang one pixel under the flare, just outside the wall
      x = x < TCX ? x - 1 : x;
      y0 = TU.top + 2;
    } else if (x > TU.x0 + 1 && x < TU.x1 - 1 && y0 > TU.top + 3) {
      // main-roof eave point hidden behind the turret: use the visible end of the eave
      x = TU.x0 - 4;
    }
    let land = G0 + 3;
    let size = 1;
    // main roof below (the turret-cone drips over the roof)
    if (y0 < RF.eave && x > RF.x0 && x < RF.x1) {
      const rt = roofTop(x);
      if (rt > y0) {
        land = rt;
        size = 0;
      }
    }
    if (size === 1) {
      for (const J of JACKS) {
        const jt = jackTop(J, x);
        if (jt > y0 && jt < land) land = jt;
      }
    }
    const per = 2.5 + 2 * hash(j, 17, 801);
    return { x, y0, land, size, per, td: Math.sqrt((2 * (land - y0 - 1)) / GRAV) };
  });

  // per-slot periods (snapped by HD.time.cycle)
  const per = (n, a, b, seed) => Array.from({ length: n }, (_, i) => a + (b - a) * hash(i, seed, 3));
  const FAR_N = 360;
  const MID_N = 280;
  const NEAR_N = 22;
  const SURF_N = 34;
  const FAR_P = per(FAR_N, 1.05, 1.35, 11);
  const MID_P = per(MID_N, 0.5, 0.62, 12);
  const NEAR_P = per(NEAR_N, 0.34, 0.42, 13);
  const SURF_P = per(SURF_N, 0.8, 1.1, 14);
  const FIRE = LY.campfire;
  const nearFlame = (x, y) => Math.abs(x - FIRE.x) < FIRE.flameW * 0.6 && y > FIRE.base - 10 && y < FIRE.base + 3;

  // ------------------------------------------------------------------
  // passes
  // ------------------------------------------------------------------
  function drawFar(g, t) {
    for (let i = 0; i < FAR_N; i++) {
      const c = T.cycle(t, i, FAR_P[i], 3301);
      const age = c.age;
      if (c.rnd(7) > dens(t - age * c.P)) continue;
      const yEnd = 200 + c.rnd(1) * 6;
      const xEnd = c.rnd(0) * (W + 24) - 12;
      const r3 = c.rnd(3);
      const len = c.rnd(2) < 0.55 ? 2 : 3;
      const ax = xEnd - S * yEnd;
      const yh = Math.round(-4 + (yEnd + 4) * age);
      const xh = ax + S * yh;
      let b = r3 < 0.3 ? 0 : r3 < 0.88 ? 1 : 2;
      if (b > 0 && inTitle(xh, yh)) b--;
      streak(g, ax, yh - len + 1, yh, FAR[b][lvOf(lum(xh, yh) * 0.6)]);
    }
  }

  function drawMid(g, t) {
    for (let i = 0; i < MID_N; i++) {
      const c = T.cycle(t, i, MID_P[i], 4409);
      const age = c.age;
      if (c.rnd(7) > dens(t - age * c.P)) continue;
      const d = c.rnd(1);
      const yl = G0 + Math.round(d * (G1 - 1 - G0));
      const xl = c.rnd(0) * (W + 30) - 15;
      const len = 3 + Math.round(d * 2 + c.rnd(2) * 1.2);
      const r3 = c.rnd(3);
      const ax = xl - S * yl;
      const yh = Math.round(-8 + (yl + 8) * age);
      const xh = ax + S * yh;
      let b = d > 0.6 ? (r3 < 0.6 ? 2 : 1) : r3 < 0.25 ? 0 : r3 < 0.85 ? 1 : 2;
      if (b > 0 && inTitle(xh, yh)) b--;
      streak(g, ax, yh - len + 1, yh, MID[b][lvOf(lum(xh, yh))]);
    }
  }

  function drawGroundSplashes(g, t) {
    const SPL_T = SPL_F * 3;
    for (let i = 0; i < MID_N; i++) {
      const c = T.cycle(t, i, MID_P[i], 4409);
      const ts = c.age * c.P;
      if (ts >= SPL_T) continue;
      const pc = c.prev;
      if (c.rnd(7, pc) > dens(t - ts - c.P)) continue;
      const d = c.rnd(1, pc);
      const yl = G0 + Math.round(d * (G1 - 1 - G0));
      const xl = Math.round(c.rnd(0, pc) * (W + 30) - 15);
      if (xl < 1 || xl > W - 2 || nearFlame(xl, yl)) continue;
      const lv = lvOf(lum(xl, yl));
      const pd = puddleAt(xl, yl);
      const f = Math.floor(ts / SPL_F);
      if (pd) {
        // a drop into a puddle makes a tiny ring instead of a crown
        if (f === 0) g.rect(xl, yl, 1, 1, RIP[2][lv]);
        else ering(g, pd, xl, yl, f + 1, RIP[f === 1 ? 1 : 0][lv]);
        continue;
      }
      const size = d < 0.3 ? 0 : d < 0.7 ? 1 : 2;
      crown(g, xl, yl, size, f, SPL, lv);
    }
  }

  function drawSurfaceSplashes(g, t) {
    for (let i = 0; i < SURF_N; i++) {
      const c = T.cycle(t, i, SURF_P[i], 5501);
      const ts = c.age * c.P;
      if (ts >= SPL_F * 2) continue;
      if (c.rnd(7) > dens(t - ts)) continue;
      const k = Math.floor(c.rnd(0) * NS);
      const x = SX[k];
      const y = SY[k];
      crown(g, x, y, 0, Math.floor(ts / SPL_F), SPL, lvOf(lum(x, y - 1)));
    }
  }

  function drawRipples(g, t) {
    for (let k = 0; k < PUD.length; k++) {
      const pd = PUD[k];
      for (let s = 0; s < pd.n; s++) {
        const c = T.cycle(t, k * 16 + s, 0.85 + 0.4 * hash(k, s, 77), 7707);
        const age = c.age;
        if (age > 0.7) continue;
        if (c.rnd(7) > dens(t - age * c.P)) continue;
        const rmax = pd.rmax - (c.rnd(3) < 0.4 ? 1 : 0);
        const a = age / 0.7;
        const r = 1 + Math.floor(rmax * a * (1.6 - 0.6 * a));
        if (r > rmax) continue;
        const cx = Math.round(pd.cx + (c.rnd(0) * 2 - 1) * Math.max(0, pd.rx - rmax - 1));
        const cy = pd.cy + Math.round((c.rnd(1) * 2 - 1) * Math.max(0, pd.ry - 1.6));
        const tone = a < 0.3 ? 2 : a < 0.65 ? 1 : 0;
        ering(g, pd, cx, cy, r, RIP[tone][lvOf(lum(cx, cy))]);
      }
    }
  }

  function drawDrips(g, t) {
    for (let j = 0; j < DRIPS.length; j++) {
      const D = DRIPS[j];
      const c = T.cycle(t, j, D.per, 8801);
      const Pd = c.P;
      const ts = c.age * Pd;
      const tr = Pd * 0.62; // let go
      const x = D.x;
      const y0 = D.y0;
      const lv = lvOf(lum(x, y0));
      if (ts < tr) {
        // the bead swells: 1px, then 2px, then stretches just before letting go
        const k = ts / tr;
        if (k < 0.18) continue;
        if (k < 0.55) g.rect(x, y0, 1, 1, DRP[k < 0.35 ? 0 : 1][lv]);
        else if (k < 0.92) {
          g.rect(x, y0, 1, 1, DRP[1][lv]);
          g.rect(x, y0 + 1, 1, 1, DRP[2][lv]);
        } else {
          g.rect(x, y0, 1, 1, DRP[0][lv]);
          g.rect(x, y0 + 1, 1, 1, DRP[1][lv]);
          g.rect(x, y0 + 2, 1, 1, DRP[2][lv]);
        }
        continue;
      }
      const tf = ts - tr;
      if (tf < D.td) {
        const yh = Math.round(y0 + 1 + 0.5 * GRAV * tf * tf);
        const len = 2 + Math.min(2, Math.floor((GRAV * tf) / 110));
        const lvf = lvOf(lum(x, yh));
        g.rect(x, yh - len + 1, 1, len - 1, DRP[1][lvf]);
        g.rect(x, yh, 1, 1, DRP[2][lvf]);
        continue;
      }
      const f = Math.floor((tf - D.td) / SPL_F);
      if (f < 3) crown(g, x, D.land, D.size, f, SPL, lvOf(lum(x, D.land)));
    }
  }

  function drawNear(g, t) {
    for (let i = 0; i < NEAR_N; i++) {
      const c = T.cycle(t, i, NEAR_P[i], 6607);
      const age = c.age;
      if (c.rnd(7) > dens(t - age * c.P)) continue;
      const len = 8 + Math.floor(c.rnd(2) * 7);
      const ax = c.rnd(0) * (W + 80) - 70;
      const r3 = c.rnd(3);
      const yh = Math.round(-18 + (H + 34) * age);
      const ym = yh - (len >> 1);
      const xm = ax + S * ym;
      const lv = lvOf(lum(xm, ym));
      let b = i < 4 ? 2 : r3 < 0.4 ? 0 : 1;
      if (b > 0 && inTitle(xm, ym)) b--;
      streak(g, ax, yh - len + 1, yh, NEAR[b][lv]);
      if (i < 4) streak(g, ax + 1, yh - len + 3, yh - 1, NEAR[0][lv]);
    }
  }

  HD.module('weather', {
    passes: [
      { layer: 'bg', z: 22, id: 'far-rain', draw: drawFar },
      { layer: 'fx', z: 26, id: 'ripples', draw: drawRipples },
      {
        layer: 'fx',
        z: 27,
        id: 'splashes',
        draw(g, t) {
          drawGroundSplashes(g, t);
          drawSurfaceSplashes(g, t);
        },
      },
      {
        layer: 'fx',
        z: 42,
        id: 'mid-rain',
        draw(g, t) {
          drawMid(g, t);
          drawDrips(g, t);
        },
      },
      { layer: 'fx', z: 66, id: 'near-rain', draw: drawNear },
    ],
  });
})();

</script>
    <script>
/* src/atmosphere.js */
/*
 * Atmosphere — chimney & campfire smoke, drifting ground mist, vignette.
 *
 *   bg  z 26  distant mist bands along the hill bases (two parallax tiles)
 *   fx  z 15  thin low ground mist (warmed by nearby light, chunk-sampled)
 *   fx  z 31  campfire smoke wisps (warm at the bottom, cooling as they rise)
 *   fx  z 32  chimney smoke column (cold, moonlit upper-right, warm if lit)
 *   fx  z 61  faint foreground wisps near the diorama lip
 *   fx  z 95  static dithered vignette (baked once, single blit)
 *
 * Everything is a pure function of t: smoke puffs are stateless loop-snapped
 * particle lives, mist tiles scroll a whole number of tile widths per loop.
 */
(function () {
  'use strict';
  const HD = window.HD;
  const P = HD.PAL;
  const T = HD.time;
  const LY = HD.layout;
  const W = HD.W;
  const H = HD.H;
  const TAU = Math.PI * 2;
  const mix = HD.color.mix;
  const hex = HD.color.hex;
  const css = HD.color.css;

  const CH = LY.house.chimney;
  const CF = LY.campfire;
  const WIND = LY.wind.smokeDrift;

  // ---------------------------------------------------------------------
  // light helpers: a handful of precomputed warm-lit variants per colour
  // ---------------------------------------------------------------------
  const AMB = HD.AMBIENT || [0.34, 0.38, 0.52];
  const FIRE = HD.LIGHT.fire;
  const LEVEL_L = [0, 0.22, 0.45, 0.8];
  function relit(c, L) {
    const a = hex(c);
    return css(a[0] * (1 + (FIRE[0] * L) / AMB[0]), a[1] * (1 + (FIRE[1] * L) / AMB[1]), a[2] * (1 + (FIRE[2] * L) / AMB[2]));
  }
  const litSet = (c, levels) => (levels || LEVEL_L).map((L) => relit(c, L));
  // smoke catches light more softly than mist (it would turn ember-orange)
  const SMOKE_L = [0, 0.1, 0.2, 0.34];
  function level(x, y) {
    const l = HD.lights.lum(x, y);
    return l < 0.07 ? 0 : l < 0.2 ? 1 : l < 0.42 ? 2 : 3;
  }

  // ---------------------------------------------------------------------
  // smoke
  // ---------------------------------------------------------------------
  const CHIM = {
    n: 30,
    life: 14,
    seed: 401,
    sx: (CH.x0 + CH.x1) / 2 + 1,
    sy: CH.top - 1,
  };
  const CAMP = {
    n: 40,
    life: 8,
    seed: 433,
    sx: CF.x,
    sy: CF.base - 33,
  };
  // tones (cold, light -> dark) each with warm-lit variants per light level
  let chimTone, campTone;

  // order puffs oldest -> youngest so younger (lower) smoke sits in front
  function puffs(sys, t, fn) {
    const n = T.cyclesFor(sys.life);
    const Pd = HD.LOOP / n;
    const N = sys.n;
    const u0 = (t * n) / HD.LOOP;
    const f0 = u0 - Math.floor(u0);
    const oldest = (Math.ceil(N * (1 - f0)) - 1 + N) % N;
    for (let k = 0; k < N; k++) {
      const i = (oldest - k + N) % N;
      const u = u0 + i / N;
      const fl = Math.floor(u);
      const a = u - fl;
      const c = ((fl % n) + n) % n;
      fn(i, a, c, Pd);
    }
  }

  function drawChimney(g, t) {
    const S = CHIM;
    puffs(S, t, (i, a, c, Pd) => {
      const r1 = HD.hash(S.seed, i, c, 1);
      const r2 = HD.hash(S.seed, i, c, 2);
      const r3 = HD.hash(S.seed, i, c, 3);
      const kx = (HD.hash(S.seed, i, c, 4) * 8) | 0;
      const ky = (HD.hash(S.seed, i, c, 5) * 8) | 0;
      const te = t - a * Pd; // emission time: puffs born in a gust drift further
      const gust = (T.noise(te, 21, 77) - 0.5) * 18;
      const rise = (58 + 10 * r1) * (1 - Math.pow(1 - a, 1.6));
      const drift = (WIND * Pd * 0.75 + gust) * Math.pow(a, 1.55);
      const curl = 2.2 * a * Math.sin(TAU * (a * 1.2 + r2));
      const x = S.sx + drift + curl;
      const y = S.sy - rise;
      const rad = 2.4 + 7.2 * Math.pow(a, 0.7) * (0.85 + 0.3 * r3);
      const lv = Math.min(1, a / 0.04) * Math.pow(1 - a, 0.8);
      if (lv <= 0.02) return;
      const xi = Math.round(x);
      const yi = Math.round(y);
      const ox = kx - xi;
      const oy = ky - yi;
      const L = level(xi, yi);
      // tone by age (banded, jittered per puff): light grey -> sky-ish blue
      const aj = a + (r3 - 0.5) * 0.12;
      const tone = aj < 0.2 ? 1 : aj < 0.42 ? 2 : aj < 0.68 ? 3 : 4;
      g.ditherCircle(xi, yi, rad, chimTone[tone][L], lv * 1.5, 0.9, ox, oy);
      // moon-facing highlight on the upper right
      const hr = rad * 0.55;
      if (tone < 4 && hr >= 1.2) {
        const hx = xi + Math.round(rad * 0.3);
        const hy = yi - Math.round(rad * 0.3);
        g.ditherCircle(hx, hy, hr, chimTone[tone - 1][L], lv * 1.25, 0.95, ox, oy);
      }
    });
  }

  function drawCamp(g, t) {
    const S = CAMP;
    puffs(S, t, (i, a, c, Pd) => {
      const r1 = HD.hash(S.seed, i, c, 1);
      const r2 = HD.hash(S.seed, i, c, 2);
      const r3 = HD.hash(S.seed, i, c, 3);
      const kx = (HD.hash(S.seed, i, c, 4) * 8) | 0;
      const ky = (HD.hash(S.seed, i, c, 5) * 8) | 0;
      const te = t - a * Pd;
      const gust = (T.noise(te, 13, 91) - 0.5) * 12;
      const rise = (82 + 8 * r1) * Math.pow(a, 0.88);
      const drift = (WIND * Pd * 0.8 + gust) * Math.pow(a, 1.5);
      const curl = 2.6 * Math.sqrt(a) * Math.sin(TAU * (a * 1.5 + T.noise(te, 6, 92) * 0.6));
      const x = S.sx + (r2 - 0.5) * 2 * (1 - a) + drift + curl;
      const y = S.sy - rise;
      // emerges as a thin solid thread from the flame tips, widens and thins out
      const rad = 0.7 + 5.2 * Math.pow(a, 0.85);
      const lv = Math.min(1, a / 0.02) * Math.min(1, 0.45 + a / 0.1) * Math.pow(1 - a, 0.9);
      if (lv <= 0.02) return;
      const xi = Math.round(x);
      const yi = Math.round(y);
      const ox = kx - xi;
      const oy = ky - yi;
      const L = level(xi, yi);
      const aj = a + (r3 - 0.5) * 0.1;
      const tone = aj < 0.12 ? 2 : aj < 0.36 ? 1 : aj < 0.64 ? 2 : 3;
      g.ditherCircle(xi, yi, rad, campTone[tone][L], lv * 1.7, 0.88, ox, oy);
      if (rad > 2.2 && tone < 3) g.ditherCircle(xi + 1, yi - 1, rad * 0.5, campTone[tone - 1][L], lv * 1.2, 0.95, ox, oy);
    });
  }

  // ---------------------------------------------------------------------
  // mist: baked tileable textures, scrolled whole tiles per loop
  // ---------------------------------------------------------------------
  // periodic 1D noise over a tile: sum of integer-frequency sines (0..1)
  function pnoise(tw, seed, terms) {
    const rng = HD.rng(seed);
    const comps = [];
    let norm = 0;
    for (const [f, amp] of terms) {
      comps.push([f, amp, rng()]);
      norm += amp;
    }
    const out = new Float32Array(tw);
    for (let x = 0; x < tw; x++) {
      let s = 0;
      for (const [f, amp, ph] of comps) s += amp * Math.sin(TAU * ((f * x) / tw + ph));
      out[x] = 0.5 + (0.5 * s) / norm;
    }
    return out;
  }

  /**
   * Bake one dithered texture per light level (or a single cold one).
   * Colour cols[1] (core) where bayer < (d - core) * 1.6, cols[0] where bayer < d.
   */
  function bakeTile(tw, h, dens, cols, lit, core) {
    const sets = cols.map((c) => (lit ? litSet(c) : [c]));
    const nv = lit ? LEVEL_L.length : 1;
    const D = new Float32Array(tw * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < tw; x++) D[y * tw + x] = dens(x, y);
    const out = [];
    for (let v = 0; v < nv; v++) {
      out.push(
        HD.bake(tw, h, (g) => {
          for (let y = 0; y < h; y++)
            for (let x = 0; x < tw; x++) {
              const d = D[y * tw + x];
              if (d <= 0) continue;
              const b = HD.bayer(x, y);
              if (b < (d - core) * 1.6) g.px(x, y, sets[1][v]);
              else if (b < d) g.px(x, y, sets[0][v]);
            }
        }),
      );
    }
    return out;
  }

  /** screen-space keep-out mask (opaque = erase mist), soft dithered rims */
  function bakeMask(y0, h, holes) {
    return HD.bake(W, h, (g) => {
      for (let y = 0; y < h; y++)
        for (let x = 0; x < W; x++) {
          let k = 0;
          for (const o of holes) {
            const qx = (x - o.x) / o.rx;
            const qy = (y + y0 - o.y) / o.ry;
            const e = Math.sqrt(qx * qx + qy * qy);
            k = Math.max(k, 1 - HD.smoothstep(0.75, 1.35, e));
          }
          if (k > 0 && HD.bayer(x, y) < k) g.px(x, y, '#fff');
        }
    });
  }

  let tmp = null;
  let tmpCtx = null;
  let tmpG = null;

  function drawBand(g, B, t) {
    const tw = B.tw;
    // == floor(phase(t, LOOP / k) * tw + sub), computed so t and t + LOOP round
    // alike; `sub` staggers the 1px steps so the bands never all jump together
    const off = ((Math.floor((t * B.k * tw) / HD.LOOP + B.sub) % tw) + tw) % tw;
    const lit = B.tex.length > 1;
    const dst = B.mask ? tmpG : g;
    const dy = B.mask ? 0 : B.y0;
    const ga = g.ctx.globalAlpha;
    if (B.mask) tmpCtx.clearRect(0, 0, W, B.h);
    else g.ctx.globalAlpha = B.alpha || 1;
    const CW = 8;
    let x = 0;
    let lv = lit ? level(x + 4, B.ly) : 0;
    while (x < W) {
      let x1 = x + CW;
      let nl = lv;
      while (x1 < W) {
        nl = lit ? level(x1 + 4, B.ly) : 0;
        if (nl !== lv) break;
        x1 += CW;
      }
      if (x1 > W) x1 = W;
      const img = B.tex[lv];
      let s = (((x - off) % tw) + tw) % tw;
      let w = x1 - x;
      let dx = x;
      while (w > 0) {
        const part = Math.min(w, tw - s);
        dst.blit(img, s, 0, part, B.h, dx, dy);
        dx += part;
        w -= part;
        s = 0;
      }
      x = x1;
      lv = nl;
    }
    if (B.mask) {
      tmpCtx.globalCompositeOperation = 'destination-out';
      tmpCtx.drawImage(B.mask, 0, 0);
      tmpCtx.globalCompositeOperation = 'source-over';
      g.ctx.globalAlpha = B.alpha || 1;
      g.blit(tmp, 0, 0, W, B.h, 0, B.y0);
    }
    g.ctx.globalAlpha = ga;
  }

  // ---------------------------------------------------------------------
  // vignette (baked once)
  // ---------------------------------------------------------------------
  function bakeVignette() {
    const c = HD.canvas(W, H, true);
    const cx = c.getContext('2d');
    const im = cx.createImageData(W, H);
    const d = im.data;
    const k0 = hex(P.night[0]);
    const k1 = hex(P.night[1]);
    const sm = HD.smoothstep;
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        const nx = (x + 0.5 - W / 2) / (W / 2);
        const ny = (y + 0.5 - H / 2) / (H / 2);
        const ax = Math.abs(nx);
        const ay = Math.abs(ny);
        // rounded-rectangle-ish distance so the frame hugs the edges
        const v = Math.pow(Math.pow(ax, 4) + Math.pow(ay, 4), 0.25) * 0.55 + Math.sqrt(nx * nx + ny * ny) * 0.45;
        let dens = sm(0.86, 1.4, v) * 0.6;
        if (ny > 0) dens += 0.14 * sm(0.4, 1, ny) * sm(0.6, 1, ax);
        if (dens <= 0) continue;
        const b = HD.bayer(x, y);
        let col = null;
        if (b < dens) col = k0;
        else if (b < dens * 1.5) col = k1;
        if (!col) continue;
        const q = (y * W + x) * 4;
        d[q] = col[0];
        d[q + 1] = col[1];
        d[q + 2] = col[2];
        d[q + 3] = col === k0 ? 190 : 150;
      }
    cx.putImageData(im, 0, 0);
    return c;
  }

  // ---------------------------------------------------------------------
  let FAR = null;
  let FAR2 = null;
  let GROUND = null;
  let FRONT = null;
  let vignette = null;

  HD.module('atmosphere', {
    init() {
      // smoke tones: light (moonlit) -> dark (almost sky), warm-lit variants
      chimTone = [
        litSet(mix(P.stone[6], P.moon[0], 0.3), SMOKE_L),
        litSet(mix(P.stone[5], P.night[7], 0.3), SMOKE_L),
        litSet(mix(P.stone[4], P.night[6], 0.4), SMOKE_L),
        litSet(mix(P.stone[3], P.night[5], 0.5), SMOKE_L),
        litSet(mix(P.night[3], P.stone[2], 0.45), SMOKE_L),
      ];
      campTone = [
        litSet(mix(P.stone[5], P.night[7], 0.25), SMOKE_L),
        litSet(mix(P.stone[4], P.wood[5], 0.35), SMOKE_L),
        litSet(mix(P.stone[3], P.night[5], 0.45), SMOKE_L),
        litSet(mix(P.night[3], P.stone[2], 0.45), SMOKE_L),
      ];

      tmp = HD.canvas(W, 32, true);
      tmpCtx = tmp.getContext('2d');
      tmpG = HD.makeGfx(tmpCtx);

      // --- distant mist banks along the hill bases (bg z 26)
      {
        const tw = 240;
        const h = 34;
        const yc = pnoise(tw, 11, [[1, 1], [3, 0.6], [5, 0.3]]);
        const th = pnoise(tw, 12, [[2, 1], [4, 0.6], [7, 0.3]]);
        const am = pnoise(tw, 13, [[1, 0.7], [2, 1], [5, 0.5], [9, 0.25]]);
        FAR = {
          tw,
          sub: 0.5,
          y0: 176,
          h,
          k: 1,
          tex: bakeTile(
            tw,
            h,
            (x, y) => {
              const c = 21 + (yc[x] - 0.5) * 8;
              const s = (y < c ? 5 : 3.5) + th[x] * 4;
              const q = (y - c) / s;
              const m = HD.smoothstep(0.15, 0.85, am[x]);
              return 0.95 * Math.exp(-q * q) * (0.25 + 0.75 * m);
            },
            [mix(P.night[5], P.stone[4], 0.35), mix(P.night[6], P.stone[5], 0.4)],
            false,
            0.5,
          ),
          alpha: 0.55,
        };
      }
      {
        const tw = 160;
        const h = 20;
        const yc = pnoise(tw, 21, [[1, 1], [2, 0.5], [5, 0.3]]);
        const am = pnoise(tw, 23, [[1, 1], [3, 0.7], [6, 0.4]]);
        FAR2 = {
          tw,
          sub: 0.23,
          y0: 188,
          h,
          k: 1,
          tex: bakeTile(
            tw,
            h,
            (x, y) => {
              const c = 11 + (yc[x] - 0.5) * 5;
              const q = (y - c) / 3.5;
              return 0.8 * Math.exp(-q * q) * HD.smoothstep(0.35, 0.9, am[x]);
            },
            [mix(P.night[6], P.stone[5], 0.4), mix(P.night[7], P.stone[6], 0.4)],
            false,
            0.45,
          ),
          alpha: 0.45,
        };
      }

      // --- thin low ground mist (fx z 15): sparse, kept off fire and porch
      {
        const tw = 480;
        const y0 = 196;
        const h = 22;
        const yc = pnoise(tw, 31, [[2, 1], [5, 0.6], [11, 0.3]]);
        const am = pnoise(tw, 33, [[1, 0.6], [3, 1], [7, 0.6], [13, 0.3]]);
        GROUND = {
          tw,
          sub: 0.71,
          y0,
          h,
          k: 1,
          ly: 205,
          tex: bakeTile(
            tw,
            h,
            (x, y) => {
              const c = 8 + (yc[x] - 0.5) * 5;
              const q = (y - c) / (y < c ? 3 : 5.5);
              return 0.8 * Math.exp(-q * q) * HD.smoothstep(0.25, 0.85, am[x]);
            },
            [mix(P.night[7], P.stone[6], 0.3), mix(P.night[8], P.stone[7], 0.3)],
            true,
            0.45,
          ),
          alpha: 0.38,
          mask: bakeMask(y0, h, [
            { x: CF.x, y: CF.base - 16, rx: 20, ry: 20 },
            { x: 220, y: 204, rx: 22, ry: 7 },
            { x: 128, y: 220, rx: 12, ry: 8 },
          ]),
        };
      }

      // --- faint foreground wisps creeping over the lip (fx z 61)
      {
        const tw = 720;
        const y0 = 226;
        const h = 24;
        const rng = HD.rng(41);
        const blobs = [];
        for (let k = 0; k < 6; k++)
          blobs.push({ x: (k + 0.15 + rng() * 0.7) * (tw / 6), y: 10 + rng() * 5, rx: 24 + rng() * 30, ry: 3 + rng() * 2.2, a: 0.5 + rng() * 0.25 });
        const tilt = pnoise(tw, 43, [[3, 1], [7, 0.5]]);
        FRONT = {
          tw,
          sub: 0.37,
          y0,
          h,
          k: 1,
          ly: 234,
          tex: bakeTile(
            tw,
            h,
            (x, y) => {
              let d = 0;
              for (const b of blobs) {
                let dx = x - b.x;
                dx -= tw * Math.round(dx / tw);
                const qx = dx / b.rx;
                const qy = (y - b.y - (tilt[x] - 0.5) * 4) / b.ry;
                const e = qx * qx + qy * qy;
                if (e < 3) d += b.a * Math.exp(-1.6 * e);
              }
              return d;
            },
            [mix(P.night[7], P.stone[6], 0.3), mix(P.night[8], P.stone[7], 0.3)],
            true,
            0.45,
          ),
          alpha: 0.42,
          mask: bakeMask(y0, h, [
            { x: 62, y: 228, rx: 11, ry: 7 },
            { x: 147, y: 228, rx: 9, ry: 6 },
            { x: CF.x, y: CF.base - 4, rx: 20, ry: 9 },
          ]),
        };
      }

      vignette = bakeVignette();
    },

    passes: [
      {
        layer: 'bg',
        z: 26,
        id: 'far-mist',
        draw(g, t) {
          drawBand(g, FAR, t);
          drawBand(g, FAR2, t);
        },
      },
      {
        layer: 'fx',
        z: 15,
        id: 'ground-mist',
        draw(g, t) {
          drawBand(g, GROUND, t);
        },
      },
      { layer: 'fx', z: 31, id: 'campfire-smoke', draw: drawCamp },
      { layer: 'fx', z: 32, id: 'chimney-smoke', draw: drawChimney },
      {
        layer: 'fx',
        z: 61,
        id: 'front-mist',
        draw(g, t) {
          drawBand(g, FRONT, t);
        },
      },
      {
        layer: 'fx',
        z: 95,
        id: 'vignette',
        draw(g) {
          g.sprite(vignette, 0, 0);
        },
      },
    ],
  });
})();

</script>
