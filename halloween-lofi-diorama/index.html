<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Purrfect Year</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" />
    <style>
      /* Single dark world: the letterbox is the night itself. */
      :root {
        --void: #04050b;
        --ink: #a3b8d8;
        --ink-dim: #5670a3;
        --veil: rgba(4, 5, 11, 0.72);
        --veil-strong: rgba(4, 5, 11, 0.86);
        --ember: #ffb54d;
        --font-pixel: 'Silkscreen', ui-monospace, Menlo, Consolas, monospace;
        --font-mono: ui-monospace, Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--ink);
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      body.idle {
        cursor: none;
      }
      #screen {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: calc(6px + env(safe-area-inset-top, 0px));
        font: 12px/1.4 var(--font-mono);
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        background: var(--veil);
        padding: 2px 6px;
        display: none;
        pointer-events: none;
      }
      #ui {
        position: fixed;
        left: 50%;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 32px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        transition: opacity 0.6s ease;
      }
      #seasons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
      }
      #seasons button {
        font: 10px/1.2 var(--font-pixel);
        letter-spacing: 0.04em;
        color: var(--ink);
        background: var(--veil-strong);
        border: 1px solid var(--ink-dim);
        padding: 5px 8px;
        cursor: pointer;
      }
      #seasons button[aria-pressed='true'] {
        color: var(--void);
        background: var(--ember);
        border-color: var(--ember);
      }
      #seasons button:focus-visible {
        outline: 2px solid var(--ember);
        outline-offset: 2px;
      }
      #hint {
        font: 10px/1.6 var(--font-pixel);
        letter-spacing: 0.06em;
        text-align: center;
        color: var(--ink);
        background: var(--veil);
        padding: 3px 10px;
      }
      #hint b {
        color: var(--ember);
        font-weight: normal;
      }
      #card {
        position: fixed;
        left: calc(18px + env(safe-area-inset-left, 0px));
        top: calc(16px + env(safe-area-inset-top, 0px));
        max-width: calc(100% - 36px);
        font-family: var(--font-pixel);
        color: var(--ink);
        background: var(--veil);
        padding: 8px 12px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #card.show {
        opacity: 1;
      }
      #card .series {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: var(--ink-dim);
      }
      #card .name {
        font-size: 18px;
        line-height: 1.3;
        color: var(--ember);
        text-wrap: balance;
      }
      #card .meta {
        font-size: 10px;
        letter-spacing: 0.06em;
      }
      body.idle #ui,
      body.export #ui,
      body.export #card {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #ui,
        #card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="480" height="270" aria-label="Purrfect Year: an animated pixel-art diary of a year, a cottage and a family of cats through the seasons"></canvas>
    <div id="hud"></div>
    <div id="card" aria-live="polite"><div class="series">PURRFECT YEAR &middot; 2026</div><div class="name"></div><div class="meta"></div></div>
    <div id="ui">
      <div id="seasons" role="group" aria-label="Choose an edition"></div>
      <div id="hint"><b>F</b> fullscreen &middot; <b>&larr; &rarr;</b> season &middot; <b>Space</b> pause &middot; <b>H</b> stats</div>
    </div>
    <script>
      // The live page opens on the edition for today's date in Boston
      // (Somerville, MA), wherever the viewer is. Tools pass ?edition=.
      (function () {
        var d = new Date();
        var md = [d.getMonth() + 1, d.getDate()];
        try {
          var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', month: 'numeric', day: 'numeric' }).formatToParts(d);
          var m = +parts.find(function (p) { return p.type === 'month'; }).value;
          var dd = +parts.find(function (p) { return p.type === 'day'; }).value;
          if (m && dd) md = [m, dd];
        } catch (e) {}
        window.HD = window.HD || {};
        window.HD.todayMD = md;
      })();
    </script>
    <!-- core -->
    <script src="src/engine.js"></script>
    <script src="src/palette.js"></script>
    <script src="src/layout.js"></script>
    <script src="src/editions.js"></script>
    <script src="src/festive.js"></script>
    <script src="src/summer.js"></script>
    <!-- scene modules (each file registers itself with HD.module) -->
    <script src="src/bg.js"></script>
    <script src="src/ground.js"></script>
    <script src="src/house.js"></script>
    <script src="src/props.js"></script>
    <script src="src/fire.js"></script>
    <script src="src/weather.js"></script>
    <script src="src/atmosphere.js"></script>
    <!-- seasonal extensions (one per module owner) -->
    <script src="src/bg-seasons.js"></script>
    <script src="src/ground-seasons.js"></script>
    <script src="src/house-seasons.js"></script>
    <script src="src/props-seasons.js"></script>
    <script src="src/fire-seasons.js"></script>
    <script src="src/weather-seasons.js"></script>
    <script src="src/atmosphere-seasons.js"></script>
    <!-- the Summer Story family -->
    <script src="src/family.js"></script>
    <script>
      // Edition picker, keyboard switching and the title card.
      (function () {
        var HD = window.HD;
        var list = HD.EDITIONS;
        var box = document.getElementById('seasons');
        var card = document.getElementById('card');
        var cardTimer = null;
        var buttons = list.map(function (e, i) {
          var b = document.createElement('button');
          b.type = 'button';
          b.id = 'ed-' + e.id;
          b.textContent = e.name;
          b.title = e.festival + ' · ' + e.when + ' (' + (i + 1) + ')';
          b.addEventListener('click', function () {
            HD.setEdition(e.id);
          });
          box.appendChild(b);
          return b;
        });
        function showCard(e) {
          card.querySelector('.series').textContent = 'PURRFECT YEAR \u00b7 2026 \u00b7 ENTRY ' + (list.indexOf(e) + 1);
          card.querySelector('.name').textContent = e.name;
          card.querySelector('.meta').textContent = e.festival + ' · ' + e.when;
          card.classList.add('show');
          clearTimeout(cardTimer);
          cardTimer = setTimeout(function () {
            card.classList.remove('show');
          }, 4200);
        }
        function sync(e) {
          buttons.forEach(function (b, i) {
            b.setAttribute('aria-pressed', list[i] === e ? 'true' : 'false');
          });
          document.title = 'Purrfect Year · ' + e.name;
          try {
            history.replaceState(null, '', '#' + e.id);
          } catch (err) {}
          showCard(e);
        }
        HD.onEdition(sync);
        sync(HD.edition);
        window.addEventListener('hashchange', function () {
          var id = location.hash.replace('#', '');
          if (HD.editionById(id)) HD.setEdition(id);
        });
        window.addEventListener('keydown', function (ev) {
          var i = list.indexOf(HD.edition);
          if (ev.key === 'ArrowRight') HD.setEdition(list[(i + 1) % list.length].id);
          else if (ev.key === 'ArrowLeft') HD.setEdition(list[(i - 1 + list.length) % list.length].id);
          else if (/^[1-9]$/.test(ev.key) && list[+ev.key - 1]) HD.setEdition(list[+ev.key - 1].id);
        });
      })();
    </script>
  </body>
</html>
