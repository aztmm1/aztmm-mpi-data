# AZTMM 0DTE Pulse — configuration
#
# INTERNAL FILE. Thresholds below never appear on user-visible pages.
# They drive aggregator.py + fetcher.py only.

# Index + megacap universe used to highlight per-ticker observations.
# The full 0DTE pulse aggregates across ALL tickers that had 0DTE flow
# alerts today (not just this list) — this universe is just the
# "named highlight" set for headline commentary.
highlight_universe:
  - SPY
  - QQQ
  - IWM
  - SPX
  - SPXW
  - NDX
  - NDXW
  - RUT
  - AAPL
  - MSFT
  - NVDA
  - TSLA
  - META
  - AMZN
  - GOOGL
  - GOOG
  - AMD
  - AVGO

# Premium / size minimums (INTERNAL — never rendered)
# A 0DTE alert must clear these to enter the aggregate.
thresholds:
  min_total_premium_usd:   5000     # $5k floor — strip obvious noise
  min_total_size:          25       # 25 contracts floor
  top_tickers_public:      10
  top_tickers_internal:    50
  commentary_top_n:        3

# How we tag call/put tilt for narrative
tilt_bands:
  heavily_call_tilted:  2.0   # premium ratio (call $ / put $) >= 2.0
  call_tilted:          1.25
  balanced_upper:       1.25
  balanced_lower:       0.80
  put_tilted:           0.50

# UW endpoint paths (private — never rendered to public output)
endpoints:
  flow_alerts:        "/api/option-trades/flow-alerts"
  total_options_vol:  "/api/market/total-options-volume"

# HTTP behaviour
http:
  base_url: "https://api.unusualwhales.com"
  timeout_seconds: 12
  max_retries: 4
  backoff_seconds: 1.5
  page_limit: 200
  max_pages: 8     # 200 * 8 = 1600 flow-alert rows scanned per run
