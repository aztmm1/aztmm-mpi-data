name: MPI + HMM Auto-Update

# Runs Mon-Fri at 09:15 ET (prior-session close) and 18:00 ET (post-close EOD).
#
# Note: GitHub Actions cron is in UTC and ET DST shifts ±1h.
# We list both EST (UTC-5) and EDT (UTC-4) cron lines; the script self-gates
# on the actual NY clock so duplicate fires no-op cleanly.
#
# Post-close cron moved to 18:00 ET to ensure EOD bars from CBOE/SA are
# published before MPI computes. Prior 16:30 ET was too early (cf.
# data-staleness incident 2026-05-14 — mpi.json reported the prior session's
# closes because SA had not yet rolled the EOD bar and CBOE CSV updates
# ~21:51 ET).
on:
  schedule:
    # 09:15 ET (prior-session close) -> 14:15 UTC (EST) and 13:15 UTC (EDT)
    - cron: "15 14 * * 1-5"
    - cron: "15 13 * * 1-5"
    # 18:00 ET (post-close EOD) -> 23:00 UTC (EST) and 22:00 UTC (EDT)
    - cron: "0 23 * * 1-5"
    - cron: "0 22 * * 1-5"
    # 22:00 ET safety net (late-publishing sources, e.g. CBOE VIX file) -> 03:00 UTC (EST) and 02:00 UTC (EDT)
    - cron: "0 3 * * 2-6"
    - cron: "0 2 * * 2-6"
    # 22:00 ET safety-net (after SA EOD bar settles ~21:51 ET) — 02:00 UTC EDT / 03:00 UTC EST, Tue-Sat for Mon-Fri NY
    - cron: "0 2 * * 2-6"
    - cron: "0 3 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if outside the 09:15 / 18:00 ET window"
        required: false
        default: "false"
      mock:
        description: "Use canned data (no network calls)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: mpi-update
  cancel-in-progress: false

jobs:
  build:
    name: Compute & publish mpi.json
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        id: run
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.mock }}"  = "true" ]; then ARGS="$ARGS --mock";  fi
          # Post-close schedule crons: force compute so GitHub scheduler latency
          # cannot push the fire outside the pipeline's internal ET gate (the
          # recurring-staleness root cause: a delayed scheduled run lands late,
          # the gate skips it, and the EOD bar never advances). Idempotent: the
          # commit step only pushes when data/mpi.json actually changes.
          case "${{ github.event.schedule }}" in
            "0 22 * * 1-5"|"0 23 * * 1-5"|"0 2 * * 2-6"|"0 3 * * 2-6") ARGS="$ARGS --force" ;;
          esac
          python mpi_hmm_pipeline.py $ARGS --output data/mpi.json

      - name: Show output (debug)
        if: always()
        run: |
          if [ -f data/mpi.json ]; then
            echo "=== data/mpi.json (first 80 lines) ==="
            head -n 80 data/mpi.json
          else
            echo "data/mpi.json not present"
          fi

      - name: Commit & push if changed
        if: success()
        run: |
          set -e
          git config user.name  "aztmm-mpi-bot"
          git config user.email "aztmm-mpi-bot@users.noreply.github.com"
          if git diff --quiet -- data/mpi.json; then
            echo "no changes to commit"
            exit 0
          fi
          git add data/mpi.json
          MSG="auto: MPI update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git commit -m "$MSG"
          git push

      - name: Surface failure summary
        if: steps.run.outcome != 'success'
        run: |
          echo "Pipeline step failed; last-good remains in data/mpi.json (if any)."
          echo "See logs above; common causes: FRED_API_KEY missing, Yahoo throttle, CNN endpoint change."
          exit 1

      - name: Notify outcome (log-only; GH Actions failure email handles alerting)
        if: always()
        run: |
          MPI_VAL=""
          if [ -f data/mpi.json ]; then
            MPI_VAL=$(python3 -c "import json; d=json.load(open('data/mpi.json')); print(d.get('mpi', d.get('score','?')))" 2>/dev/null || echo "")
          fi
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            python3 aztmm-daily-pulse-v2/notify_email.py ok "MPI Update" \
              --mpi "${MPI_VAL:-n/a}" \
              --post "https://cdn.jsdelivr.net/gh/aztmm1/aztmm-mpi-data@main/data/mpi.json"
          else
            python3 aztmm-daily-pulse-v2/notify_email.py fail "MPI Update" \
              --mpi "${MPI_VAL:-n/a}" \
              --err "Pipeline step outcome: ${{ steps.run.outcome }} - see https://github.com/aztmm1/aztmm-mpi-data/actions/runs/${{ github.run_id }}"
          fi

      - name: Regenerate canonical-content.json
        # canonical-content-api-step
        if: always()
        run: |
          python3 aztmm-content-api/build_canonical.py --repo-root . --output data/canonical-content.json || true
          if ! git diff --quiet -- data/canonical-content.json; then
            git config user.name  "aztmm-bot"
            git config user.email "aztmm-bot@users.noreply.github.com"
            git add data/canonical-content.json
            git commit -m "auto: refresh canonical-content.json"
            for i in 1 2 3 4; do
              if git pull --rebase origin main >/dev/null 2>&1 && git push origin main; then
                echo "  canonical push ok on attempt $i"; break
              fi
              echo "  canonical push attempt $i failed - sleeping $((i*3))s"; sleep $((i*3))
            done
          else
            echo "canonical-content.json unchanged"
          fi

      - name: Purge jsDelivr cache (kills 12h edge cache after commit)
        if: always()
        run: |
          PATHS=(
            "data/mpi.json"
            "data/mpi-history.json"
            "data/canonical-content.json"
          )
          for path in "${PATHS[@]}"; do
            url="https://purge.jsdelivr.net/gh/aztmm1/aztmm-mpi-data@main/${path}"
            echo "::group::Purge ${path}"
            curl -sS --fail "${url}" || echo "purge failed for ${path}, continuing"
            echo "::endgroup::"
          done
