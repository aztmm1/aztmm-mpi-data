# === PATH A LOCKED 2026-05-15 - reads House Clerk PTR feed only ===
# Free-source replacement for the UW-derived pipeline. Pulls 2026FD.ZIP from
# disclosures-clerk.house.gov, parses recent Periodic Transaction Reports,
# and writes the same public.json + HTML artifacts the page consumes.
# Senate (efdsearch.senate.gov) is phase 2.

name: AZTMM Congress Watch

# House Clerk PTRs are batch-processed by the Clerk. Daily 6 AM UTC is plenty;
# nothing useful is gained from intra-day polling.
on:
  schedule:
    - cron: '0 6 * * *'   # 6 AM UTC daily - House data updates infrequently
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (default: today UTC)'
        required: false
      max_filings:
        description: 'Max PTR PDFs to pull this run (default 50)'
        required: false
        default: '50'
      force_publish:
        description: 'Force WP status=publish (else draft)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  congress-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_SITE: ${{ secrets.WP_SITE }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (pdftotext via poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Install Python deps
        working-directory: congress-trades-tracker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run House Clerk pipeline
        working-directory: congress-trades-tracker
        run: |
          DATE="${{ github.event.inputs.date }}"
          MAX="${{ github.event.inputs.max_filings }}"
          FP="${{ github.event.inputs.force_publish }}"
          ARGS=""
          if [ -n "$DATE" ]; then ARGS="$ARGS --date $DATE"; fi
          if [ -n "$MAX" ]; then ARGS="$ARGS --max-filings $MAX"; fi
          if [ "$FP" != "false" ]; then ARGS="$ARGS --force-publish"; fi
          mkdir -p publish-artifacts
          python house_clerk_runner.py $ARGS --out-dir publish-artifacts/ > publish-artifacts/run-summary.json

      - name: Publish to WordPress
        working-directory: congress-trades-tracker
        run: |
          if [ -f ../_shared/publish_page_to_wp.py ]; then
            python ../_shared/publish_page_to_wp.py publish-artifacts/*-wp-payload.json
          else
            echo "publish_page_to_wp.py not present yet; payload retained for manual push"
          fi

      - name: Commit run artifacts
        if: always()
        run: |
          git config user.name "aztmm-bot"
          git config user.email "bot@aztmm.local"
          mkdir -p congress-trades-tracker/sample-output/
          if [ -d congress-trades-tracker/publish-artifacts/ ]; then
            cp -f congress-trades-tracker/publish-artifacts/*.json congress-trades-tracker/sample-output/ 2>/dev/null || true
            cp -f congress-trades-tracker/publish-artifacts/*.html congress-trades-tracker/sample-output/ 2>/dev/null || true
          fi
          cd congress-trades-tracker/sample-output/ 2>/dev/null && {
            LATEST_JSON=$(ls congress-*.public.json 2>/dev/null | sort -r | head -1) && [ -n "$LATEST_JSON" ] && cp -f "$LATEST_JSON" latest.json
            LATEST_HTML=$(ls congress-*.html 2>/dev/null | sort -r | head -1) && [ -n "$LATEST_HTML" ] && cp -f "$LATEST_HTML" latest.html
            cd - >/dev/null
          } || true

          git add congress-trades-tracker/data/ congress-trades-tracker/sample-output/ || true
          git diff --cached --quiet || git commit -m "congress-watch (house-clerk): log run $(date -u +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase origin main >/dev/null 2>&1; then
              if git push origin main; then
                echo "  push ok on attempt $i"; break
              fi
            fi
            echo "  push attempt $i failed - sleeping $((i*3))s"
            sleep $((i*3))
          done

      - name: Regenerate WP page HTML + update via REST
        if: always()
        env:
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          if [ -f congress-trades-tracker/sample-output/latest.json ]; then
            python3 scripts/rebuild_tracker_html.py \
              --tracker congress \
              --page-id 2624 \
              --input-json congress-trades-tracker/sample-output/latest.json \
              --update-wp
          else
            echo "no latest.json; skipping WP update"
          fi

