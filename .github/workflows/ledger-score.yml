name: AZTMM Accountability Ledger

on:
  schedule:
    # 03:15 UTC Tue-Sat = 23:15 ET previous day Mon-Fri (after the 5 PM ET
    # Daily Pulse publish + buffer). During EST (winter) this runs 22:15 ET,
    # still safely after publish.
    - cron: "15 3 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes, no commit)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aztmm-accountability-ledger
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance beautifulsoup4

      - name: Extract and score
        run: |
          set +e
          ARGS="--repo-root ."
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 accountability-ledger/extract_and_score.py $ARGS
          rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "Nothing to do tonight (no new rows, no score changes)."
            exit 0
          fi
          exit $rc

      - name: Append MPI history point (regime timeline)
        if: ${{ inputs.dry_run != true }}
        run: |
          python3 - <<'PY'
          import json, os
          mpi = json.load(open('data/mpi.json'))
          subs = mpi["data"].get("sub_indicators") or {}
          row = {"date": mpi.get("asOf"), "score": mpi["data"]["mpi_score"], "regime": mpi["data"]["regime_label"],
                 "subs": {k: (v.get("score") if isinstance(v, dict) else v) for k, v in subs.items()}}
          path = 'data/mpi-history.json'
          hist = {"note": "MPI + regime by session. Appended nightly by ledger-score workflow since 2026-06-10. Never backfilled.", "rows": []}
          if os.path.exists(path):
              try: hist = json.load(open(path))
              except Exception: pass
          rows = [r for r in hist.get("rows", []) if r.get("date") != row["date"]]
          rows.append(row)
          rows.sort(key=lambda r: r.get("date") or "")
          hist["rows"] = rows[-260:]
          json.dump(hist, open(path, "w"), indent=1)
          print("history rows:", len(hist["rows"]))
          PY

      - name: Commit ledger updates
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "aztmm-ledger-bot"
          git config user.email "aztmm-ledger-bot@users.noreply.github.com"
          git add data/calls.json data/mpi-history.json accountability-ledger/sample-output/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "ledger: score $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

# --- OG card generation steps -----------------------------------------------
# Insert into an existing GitHub Actions job that has already run
# actions/checkout (with a token allowed to push) and actions/setup-python
# (3.11). Assumes render_og.py lives at scripts/render_og.py in the repo —
# adjust RENDER_SCRIPT below if you place it elsewhere.

      - name: Install OG card dependencies
        run: pip install cairosvg

      - name: Generate missing OG cards
        env:
          RENDER_SCRIPT: scripts/render_og.py
          OG_DIR: aztmm-content-api/og
        run: |
          python3 - <<'PY'
          import html, json, os, subprocess, sys, urllib.request

          og_dir = os.environ["OG_DIR"]
          script = os.environ["RENDER_SCRIPT"]
          os.makedirs(og_dir, exist_ok=True)

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "aztmm-og-bot"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          posts = fetch("https://public-api.wordpress.com/wp/v2/sites/aztmm.com/posts"
                        "?per_page=6&_fields=slug,title,date")
          canon = fetch("https://raw.githubusercontent.com/aztmm1/aztmm-mpi-data/"
                        "main/data/canonical-content.json")
          mpi = canon.get("mpi", {})
          score = str(mpi.get("score", "—"))
          regime = str(mpi.get("regime", "—"))

          failures = 0
          for post in posts:
              slug = post["slug"]
              out = os.path.join(og_dir, f"{slug}.png")
              if os.path.exists(out):
                  print(f"[skip] {slug}")
                  continue
              title = html.unescape(post["title"]["rendered"])
              date = post["date"][:10]  # YYYY-MM-DD
              cmd = [sys.executable, script,
                     "--slug", slug, "--title", title, "--date", date,
                     "--mpi", score, "--regime", regime, "--outdir", og_dir]
              if subprocess.run(cmd).returncode != 0:
                  failures += 1
                  print(f"[error] render failed for {slug}", file=sys.stderr)
          sys.exit(1 if failures else 0)
          PY

      - name: Commit OG cards
        run: |
          git add aztmm-content-api/og
          if git diff --cached --quiet; then
            echo "No new OG cards — skipping commit."
          else
            git config user.name "aztmm-og-bot"
            git config user.email "actions@github.com"
            git commit -m "og: cards $(date -u +%F) [skip ci]"
            git push
          fi
# --- end OG card generation steps --------------------------------------------
      - name: Regenerate canonical content (if builder present)
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -f aztmm-content-api/build_canonical.py ]; then
            python3 aztmm-content-api/build_canonical.py --repo-root . || true
            git add -A
            if git diff --cached --quiet; then
              echo "No canonical changes to commit."
            else
              git commit -m "ledger: canonical rebuild $(date -u +%Y-%m-%d) [skip ci]"
              git push
            fi
          else
            echo "aztmm-content-api/build_canonical.py not present; skipping."
          fi
