name: AZTMM Squeeze Watch

# Schedule: weekday 5 PM ET (handles DST automatically by registering both crons)
# - EDT (Mar–Nov): 21:00 UTC
# - EST (Nov–Mar): 22:00 UTC
# Both fire; the script idempotently skips if the per-date log shows
# status == 'payload_emitted' or 'dry_run_ok'.
on:
  schedule:
    - cron: '0 21 * * 1-5'   # 5 PM ET during EDT
    - cron: '0 22 * * 1-5'   # 5 PM ET during EST
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (default: today UTC)'
        required: false
      dry_run:
        description: 'Dry run only (no publish to jsDelivr)'
        required: false
        default: 'false'

permissions:
  contents: write   # commit the dated artefacts + log

jobs:
  squeeze-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      UW_API_KEY: ${{ secrets.UW_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        working-directory: squeeze-watch
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Idempotency guard
        id: guard
        working-directory: squeeze-watch
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # Skip if the public artefact for this date already exists.
          if [ -f "sample-output/squeeze-$DATE.public.json" ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        if: steps.guard.outputs.already_ran == 'false'
        working-directory: squeeze-watch
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python run.py $ARGS

      - name: Commit artefacts
        if: always()
        run: |
          git config user.name "aztmm-bot"
          git config user.email "bot@aztmm.local"
          # Stable URLs: latest.{json,html} copies for jsDelivr to serve
          if [ -d squeeze-watch/sample-output/ ]; then
            cd squeeze-watch/sample-output/
            LATEST_JSON=$(ls squeeze-*.public.json 2>/dev/null | sort -r | head -1) && [ -n "$LATEST_JSON" ] && cp -f "$LATEST_JSON" latest.json
            LATEST_HTML=$(ls squeeze-*.html 2>/dev/null | sort -r | head -1) && [ -n "$LATEST_HTML" ] && cp -f "$LATEST_HTML" latest.html
            cd - >/dev/null
          fi
          git add squeeze-watch/sample-output/ squeeze-watch/data/ || true
          git diff --cached --quiet || git commit -m "squeeze-watch: snapshot ${{ steps.guard.outputs.date }}"
          # Race-safe push: pull-rebase + retry up to 4 times
          for i in 1 2 3 4; do
            if git pull --rebase origin main >/dev/null 2>&1; then
              if git push origin main; then
                echo "  push ok on attempt $i"; break
              fi
            fi
            echo "  push attempt $i failed — sleeping $((i*3))s"
            sleep $((i*3))
          done
