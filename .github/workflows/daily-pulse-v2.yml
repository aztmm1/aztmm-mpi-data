# === FREE-SOURCE PIPELINE — AUTO-CRON ENABLED 2026-05-15 ===
# Path A compliant: yfinance EOD chains + FINRA OTC ATS weekly + SEC EDGAR
# Form 4 + repo data/mpi.json. Zero UW dependency.
# Aggregator: commit 70d53233. Conviction gate >=80 internal-only.
# Daily 5 PM ET cron Mon-Fri.

name: AZTMM Daily Pulse v2

# Schedule: 5 PM ET, Mon–Fri (LIVE since 2026-05-15).
# - During EDT (Mar–Nov): 21:00 UTC
# - During EST (Nov–Mar): 22:00 UTC
# Auto-cron is active. Pipeline is idempotent — re-running same date is safe.
# Manual triggers via workflow_dispatch still work.
# The script idempotently skips if the run-log for the date already exists
# with status=='payload_emitted' or 'dry_run_ok'.
on:
  schedule:
    - cron: '0 21 * * 1-5'   # 5 PM ET during EDT (Mar-Nov)
    - cron: '0 22 * * 1-5'   # 5 PM ET during EST (Nov-Mar)
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (default: today)'
        required: false
      dry_run:
        description: 'Dry run only (no publish)'
        required: false
        default: 'false'
      force_publish:
        description: 'Force status=publish (else draft)'
        required: false
        default: 'false'

permissions:
  contents: write   # commit run-logs back

jobs:
  daily-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_SITE: ${{ secrets.WP_SITE }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      UW_API_TOKEN: ${{ secrets.UW_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        working-directory: aztmm-daily-pulse-v2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Idempotency guard
        id: guard
        working-directory: aztmm-daily-pulse-v2
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # WINDOW-AWARE IDEMPOTENCY (patched 2026-06-02):
          # Only skip if a PUBLISHED WordPress post already exists for this date.
          # Local run-logs don't count — AM aggregator runs shouldn't block PM publish.
          DATE_MMDD=$(echo "$DATE" | awk -F- '{printf "%s-%s", $2, $3}')
          # Query WP REST for posts in daily-pulse category (730419628) on this date
          EXISTING=$(curl -fsS "https://aztmm.com/wp-json/wp/v2/posts?categories=730419628&after=${DATE}T00:00:00&before=${DATE}T23:59:59&per_page=1&_fields=id,date,slug" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "0")
          if [ "$EXISTING" -ge "1" ]; then
            echo "Post for $DATE already published — skipping"
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "No post for $DATE yet — proceeding"
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (emit payload)
        if: steps.guard.outputs.already_ran == 'false'
        working-directory: aztmm-daily-pulse-v2
        run: |
          mkdir -p publish-artifacts/ data/daily-pulse-logs/
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force_publish }}" = "true" ]; then ARGS="$ARGS --force-publish"; fi
          python run_daily_pulse.py $ARGS --out-dir publish-artifacts/ > publish-artifacts/payload.json

      - name: Publish to WordPress (REST API)
        if: steps.guard.outputs.already_ran == 'false' && github.event.inputs.dry_run != 'true' && env.WP_APP_PASSWORD != ''
        continue-on-error: false
        working-directory: aztmm-daily-pulse-v2
        run: |
          python publish_to_wp.py publish-artifacts/payload.json || echo "WP publish failed — payload still committed to repo for manual review"

      - name: Commit run logs
        if: always()
        run: |
          git config user.name "aztmm-bot"
          git config user.email "bot@aztmm.local"
          # Promote publish-artifacts/ -> sample-output/ for jsDelivr serving
          mkdir -p aztmm-daily-pulse-v2/sample-output/
          if [ -d aztmm-daily-pulse-v2/publish-artifacts/ ]; then
            cp -f aztmm-daily-pulse-v2/publish-artifacts/*.html aztmm-daily-pulse-v2/sample-output/ 2>/dev/null || true
            cp -f aztmm-daily-pulse-v2/publish-artifacts/payload.json aztmm-daily-pulse-v2/sample-output/daily-pulse-${{ steps.guard.outputs.date }}.payload.json 2>/dev/null || true
          fi
          # Stable URLs: latest.{json,html} copies for jsDelivr to serve
          cd aztmm-daily-pulse-v2/sample-output/ 2>/dev/null && {
            LATEST_JSON=$(ls daily-pulse-*.payload.json 2>/dev/null | sort -r | head -1) && [ -n "$LATEST_JSON" ] && cp -f "$LATEST_JSON" latest.json
            LATEST_HTML=$(ls daily-pulse-*.html 2>/dev/null | sort -r | head -1) && [ -n "$LATEST_HTML" ] && cp -f "$LATEST_HTML" latest.html
            cd - >/dev/null
          } || true

          git add aztmm-daily-pulse-v2/data/ aztmm-daily-pulse-v2/sample-output/ || true
          git diff --cached --quiet || git commit -m "daily-pulse: log run ${{ steps.guard.outputs.date }}"
          # Race-safe push: pull-rebase + retry up to 4 times
          for i in 1 2 3 4; do
            if git pull --rebase origin main >/dev/null 2>&1; then
              if git push origin main; then
                echo "  push ok on attempt $i"; break
              fi
            fi
            echo "  push attempt $i failed — sleeping $((i*3))s"
            sleep $((i*3))
          done
