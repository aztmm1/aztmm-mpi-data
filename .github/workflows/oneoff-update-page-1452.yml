name: One-off WP page 1452 update
on:
  workflow_dispatch: {}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update page 1452
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          user = os.environ["WP_USERNAME"]
          pw = os.environ["WP_APP_PASSWORD"]
          token = base64.b64encode(f"{user}:{pw}".encode()).decode()
          with open("tmp/pulse-lab-1452-content-2026-06-03.html") as f:
              content = f.read()
          body = {"content": content}
          req = urllib.request.Request(
              "https://aztmm.com/wp-json/wp/v2/pages/1452",
              data=json.dumps(body).encode(),
              method="POST",
              headers={
                  "Authorization": f"Basic {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "aztmm-mpi-oneoff/1.0",
              }
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  d = json.loads(r.read())
                  print("modified:", d.get("modified"))
                  print("link:", d.get("link"))
                  print("status:", d.get("status"))
                  cw = d.get("_content_warnings")
                  if cw: print("WARNINGS:", cw)
          except urllib.error.HTTPError as e:
              print("HTTP error:", e.code, e.read().decode()[:1000])
              raise SystemExit(1)
          PY
