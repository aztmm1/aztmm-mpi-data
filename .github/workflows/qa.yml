name: QA Self-Audit

# Nightly public data-quality score against the v2.2 rubric. Runs after
# the ledger cron (03:15 UTC Tue-Sat) so it audits the fully-updated surface.
# Also renders social/latest-card.png - the shareable nightly ledger card.
on:
  schedule:
    - cron: "0 7 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Score & publish data/qa.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run QA scorer
        run: python qa/qa/qa_score.py

      - name: Render social card
        run: |
          pip install --quiet pillow
          set +e
          python social/make_card.py > social/render.log 2>&1
          echo "exit=$?" >> social/render.log
          ls -la social >> social/render.log
          set -e

      - name: Commit & push if changed
        run: |
          set -e
          git config user.name  "aztmm-qa-bot"
          git config user.email "aztmm-qa-bot@users.noreply.github.com"
          git add -A -- data/qa.json social
          if [ -z "$(git status --porcelain -- data/qa.json social)" ]; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "auto: QA self-audit $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            if git pull --rebase origin main >/dev/null 2>&1 && git push origin main; then
              echo "push ok on attempt $i"; break
            fi
            echo "push attempt $i failed - sleeping $((i*5))s"; sleep $((i*5))
          done

      - name: Purge jsDelivr cache
        if: always()
        run: |
          curl -sS -X POST "https://purge.jsdelivr.net/gh/aztmm1/aztmm-mpi-data@main/data/qa.json" || true
          curl -sS -X POST "https://purge.jsdelivr.net/gh/aztmm1/aztmm-mpi-data@main/social/latest-card.png" || true
