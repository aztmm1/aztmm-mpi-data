name: QA Self-Audit

# Nightly public data-quality score against the v2.2 rubric. Runs after
# the ledger cron (03:15 UTC Tue-Sat) so it audits the fully-updated surface.
on:
  schedule:
    - cron: "0 7 * * 2-6"→ Runs at 07:00, Tuesday through Saturday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Score & publish data/qa.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run QA scorer
        run: python qa/qa/qa_score.py  # path as committed; tidy to qa/ later

      - name: Commit & push if changed
