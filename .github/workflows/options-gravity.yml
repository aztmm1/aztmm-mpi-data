# === PATH A LOCKED 2026-05-15 ===
# Rebuilt on yfinance EOD options chain — NO Unusual Whales.
# Computes NOPE (delta * volume / share_volume) + classic max-pain.
# Universe: SPY, SPX (via SPY chain proxy), QQQ.

name: AZTMM Options Gravity (NOPE & Max-Pain)

on:
  schedule:
    - cron: '0 21 * * 1-5'   # 5 PM ET during EDT
    - cron: '0 22 * * 1-5'   # 5 PM ET during EST
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (default: today)'
        required: false

permissions:
  contents: write

jobs:
  options-gravity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: DST gate (only 5 PM ET)
        id: dst
        run: |
          ET_HOUR=$(TZ=America/New_York date +%H)
          if [ "$ET_HOUR" = "17" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: ET hour is $ET_HOUR (not 17)"
          fi

      - name: Set up Python
        if: steps.dst.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.dst.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: nope-max-pain-tracker
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run yf_fetcher (NOPE + Max-Pain)
        if: steps.dst.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: nope-max-pain-tracker
        run: python yf_fetcher.py

      - name: Commit output
        if: steps.dst.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "aztmm-bot"
          git config user.email "bot@aztmm.local"
          git add nope-max-pain-tracker/sample-output/ || true
          git diff --cached --quiet || git commit -m "options-gravity: yf run $(TZ=America/New_York date +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase origin main >/dev/null 2>&1; then
              if git push origin main; then
                echo "push ok on attempt $i"; break
              fi
            fi
            echo "push attempt $i failed; sleeping $((i*3))s"
            sleep $((i*3))
          done

      - name: Regenerate WP page HTML + update via REST
        if: always()
        env:
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          if [ -f nope-max-pain-tracker/sample-output/latest.json ]; then
            python3 scripts/rebuild_tracker_html.py \
              --tracker gravity \
              --page-id 2625 \
              --input-json nope-max-pain-tracker/sample-output/latest.json \
              --update-wp
          else
            echo "no latest.json; skipping WP update"
          fi


      - name: Regenerate canonical-content.json
        # canonical-content-api-step
        if: always()
        run: |
          python3 aztmm-content-api/build_canonical.py --repo-root . --output data/canonical-content.json || true
          if ! git diff --quiet -- data/canonical-content.json; then
            git config user.name  "aztmm-bot"
            git config user.email "aztmm-bot@users.noreply.github.com"
            git add data/canonical-content.json
            git commit -m "auto: refresh canonical-content.json"
            for i in 1 2 3 4; do
              if git pull --rebase origin main >/dev/null 2>&1 && git push origin main; then
                echo "  canonical push ok on attempt $i"; break
              fi
              echo "  canonical push attempt $i failed - sleeping $((i*3))s"; sleep $((i*3))
            done
          else
            echo "canonical-content.json unchanged"
          fi
