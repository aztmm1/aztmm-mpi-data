name: Canonical Content Refresh

# 2026-08-05: canonical-content.json was only ever regenerated as a side-effect of
# mpi-update.yml and ledger-score.yml. Nothing refreshed it when a Pulse published,
# so after the 5 PM ET Daily Pulse the homepage kept advertising the PREVIOUS day's
# post until the next mpi/ledger run happened to fire. On 2026-08-05 that left the
# homepage pill pointing at the 4 Aug Condensed Auto Edition for five hours.
#
# This workflow closes that gap: it refreshes canonical shortly after each publish
# window, and can be dispatched manually to unstick the homepage immediately.

on:
  schedule:
    # 17:45 ET weekdays, ~30 min after the Daily Pulse lands -> 21:45 UTC (EDT) / 22:45 UTC (EST)
    - cron: "45 21 * * 1-5"
    - cron: "45 22 * * 1-5"
    # 10:45 ET Saturday, after the weekly free-source Pulse -> 14:45 UTC (EDT) / 15:45 UTC (EST)
    - cron: "45 14 * * 6"
    - cron: "45 15 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate canonical-content.json
        run: |
          python3 aztmm-content-api/build_canonical.py --repo-root . --output data/canonical-content.json

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- data/canonical-content.json; then
            git config user.name  "aztmm-bot"
            git config user.email "aztmm-bot@users.noreply.github.com"
            git add data/canonical-content.json
            git commit -m "auto: refresh canonical-content.json (post-publish)"
            for i in 1 2 3 4; do
              if git pull --rebase origin main >/dev/null 2>&1 && git push origin main; then
                echo "  canonical push ok on attempt $i"; break
              fi
              echo "  canonical push attempt $i failed - sleeping $((i*3))s"; sleep $((i*3))
            done
          else
            echo "canonical-content.json unchanged"
          fi

      - name: Purge jsDelivr edge cache
        if: always()
        run: |
          curl -sS --fail "https://purge.jsdelivr.net/gh/aztmm1/aztmm-mpi-data@main/data/canonical-content.json" || echo "purge failed, continuing"

      - name: Report what the site will now show
        if: always()
        run: |
          python3 - <<PY
          import json
          d = json.load(open("data/canonical-content.json"))
          p = d.get("latest_daily_pulse") or {}
          m = d.get("mpi") or {}
          print("latest_daily_pulse:", p.get("id"), p.get("date"))
          print("mpi:", m.get("score"), m.get("as_of"))
          PY
