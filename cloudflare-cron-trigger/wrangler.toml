name = "aztmm-cron-v2"
main = "worker.js"
compatibility_date = "2024-12-01"

# Cron runs in UTC. Worker logic gates on ET windows internally.
# - Mon-Fri 13:00-23:59 UTC: daytime + MPI + EOD daily pulse window (08-19 ET roughly)
# - Tue-Sat 00:00-04:59 UTC: late-night watchdog window (covers Mon-Fri 20:00-23:59 ET
#   when GH Actions cron runs and may need a 23:00 ET retry)
# - Sat 13:00-14:59 UTC: weekly pulse window + 09:45 ET watchdog
[triggers]
crons = [
  "*/15 13-23 * * 1-5",
  "*/15 0-4 * * 2-6",
  "*/15 13-14 * * 6"
]

# KV namespace for trigger log (last 200 events).
# Namespace in CF dashboard is named "aztmm-cron-log".
# Binding name MUST stay "KV" because worker.js references env.KV.
[[kv_namespaces]]
binding = "KV"
id = "ccb3b59bf4024734a7c4bb8cb288e750"

# Observability — Workers Logs visible in dashboard
[observability]
enabled = true

# Secrets — set in CF dashboard → Workers & Pages → your worker → Settings → Variables and Secrets
# Do NOT commit secret values to this file.
#   GH_PAT             — GitHub PAT with `repo` + `workflow` scope (or fine-grained equiv)
#   HEALTHCHECKS_URL   — optional, e.g. https://hc-ping.com/<uuid>
#   MANUAL_TOKEN       — optional, required for POST /run
